# ============================================================================
# SFT on 2x H200 nodes (2 GPUs/node = 4 GPUs total)  -- MULTI-NODE DDP
#
# No vLLM: every GPU trains. 2 nodes x 2 GPUs = 4 DDP processes; gradients and
# weights sync across both nodes. To scale to 3 nodes just set NUM_NODES=3
# (see configs/sft_h200_3node.conf) -- no other change needed.
#
# Submit:
#   ./submit_training_code.sh configs/sft_h200_2node.conf
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=Qwen/Qwen2.5-7B-Instruct
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=sft_7b_h200_2node

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
# Effective batch = PER_DEVICE_TRAIN_BATCH_SIZE * (NUM_NODES*GPUS_PER_NODE) * GRADIENT_ACCUMULATION_STEPS.
# 4 GPUs here (1*4*64 = 256 global), matching the 3-node example's global batch.
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=64
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=8192
MAX_PROMPT_LENGTH=2048

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology ---
PARTITION=h200
NUM_NODES=2
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=7-00:00:00

# --- LoRA / MoE ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode (True = print srun/accelerate commands, launch nothing) ---
DRY_RUN=False
