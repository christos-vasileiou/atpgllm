# ============================================================================
# SFT on H200 nodes  -- MULTI-NODE DDP (no vLLM; every GPU trains)
#
# 3 nodes x 2 GPUs = 6 DDP processes; gradients/weights sync across all nodes.
# For a 2-node run just set NUM_NODES=2 (4 processes) -- no other change needed.
#
# Submit:
#   ./submit_training_code.sh configs/sft_h200_3node.conf
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=Qwen/Qwen2.5-7B-Instruct
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=sft_7b_h200_3node

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
# Effective batch = PER_DEVICE_TRAIN_BATCH_SIZE * (NUM_NODES*GPUS_PER_NODE) * GRADIENT_ACCUMULATION_STEPS.
# 6 GPUs here, so a given global batch needs ~1/6 the grad-accum of a single GPU.
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=43
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=8192
MAX_PROMPT_LENGTH=2048

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology ---
PARTITION=h200
NUM_NODES=3
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G

# --- LoRA / MoE ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode (True = print srun/accelerate commands, launch nothing) ---
DRY_RUN=False
