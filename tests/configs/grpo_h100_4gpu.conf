# ============================================================================
# GRPO on the 4x H100-80GB node (g-04-02)  -- SINGLE-NODE (unchanged behavior)
#
# Layout (single-node carve, handled by the single-node path):
#   GPU 3      : trl vllm-serve (last GPU)
#   GPUs 0-2   : DDP training (accelerate, 3 processes)
# CUDA_VISIBLE_DEVICES is trimmed to the 3 training GPUs automatically.
#
# This documents the "4xH100 example" as a first-class config. It behaves
# exactly like the previous single-node runs (NUM_NODES=1 => single-node path).
#
# Submit:
#   ./submit_training_code.sh configs/grpo_h100_4gpu.conf
# ============================================================================

# --- Core (MODEL may be empty for GRPO when resuming; kept for the vLLM server) ---
METHOD=grpo
MODEL=Qwen/Qwen2.5-7B-Instruct
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=grpo_7b_h100

# --- Resume / streaming offset ---
RESUME_FROM=sft_7b_exper1/checkpoint-200
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization (train GPUs = 3 here: GPUS_PER_NODE - 1 vLLM GPU) ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=1536
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=16384
MAX_PROMPT_LENGTH=4096
MAX_COMPLETION_LENGTH=12288

# --- GRPO-specific ---
BUFFER_SIZE=30000
NUM_GENERATIONS=16
STEPS_PER_GENERATION=16
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology (SINGLE NODE: NUM_NODES=1) ---
PARTITION=h100
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G

# --- vLLM server (single-node: 1 GPU serves vLLM; TP/DP stay 1) ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
