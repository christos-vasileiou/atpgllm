# ============================================================================
# GRPO on 2x H200 nodes (2 GPUs/node = 4 GPUs total)  -- MULTI-NODE, dedicated vLLM
#
# Layout (dedicated vLLM node):
#   node A (last)  : trl vllm-serve, 2 GPUs -> data-parallel-size=2 (2 gen engines)
#   node B (first) : 2 GPUs -> DDP training (accelerate, 2 processes)
#   Only global rank 0 syncs weights to / generates from the vLLM node (over IP).
#
# Submit (freezes config at submit time and sets sbatch --nodes/--gres/...):
#   ./submit_training_code.sh configs/grpo_h200_2node.conf
# ============================================================================

# --- Core (MODEL is the BASE model the vLLM server loads; REQUIRED here) ---
METHOD=grpo
MODEL=Qwen/Qwen2.5-7B-Instruct
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=grpo_7b_h200_2node

# --- Resume / streaming offset ---
RESUME_FROM=sft_7b_exper1/checkpoint-200
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
# Effective prompts/step = PER_DEVICE_TRAIN_BATCH_SIZE * (train GPUs) * GRADIENT_ACCUMULATION_STEPS.
# Here train GPUs = (NUM_NODES-1) * GPUS_PER_NODE = 1 * 2 = 2. Tune to keep it
# divisible by NUM_GENERATIONS.
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=2304
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=16384
MAX_PROMPT_LENGTH=4096
MAX_COMPLETION_LENGTH=12288

# --- GRPO-specific ---
BUFFER_SIZE=30000
NUM_GENERATIONS=16
STEPS_PER_GENERATION=16
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology ---
PARTITION=h200
NUM_NODES=2
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G

# --- vLLM server ---
# TP*DP is forced to GPUS_PER_NODE by the launcher; TP=1 -> DP=2 (two engines).
# For a >=32B model set TENSOR_PARALLEL_SIZE=2 (=> DP=1) so it shards across the node.
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=2
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode (True = print srun/accelerate/vllm commands, launch nothing) ---
DRY_RUN=False
