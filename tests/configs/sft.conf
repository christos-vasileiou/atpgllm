# ============================================================================
# SFT run configuration for run_training_code.sh
#
# This file is SOURCED by run_training_code.sh, which is given the config path
# as its first positional argument. Do NOT `export` anything here and do NOT
# pass these variables in the submit-time environment:
#
#   ./submit_training_code.sh configs/sft.conf   # SLURM: freeze config at submit time
#   ./run_training_code.sh      configs/sft.conf   # direct / interactive
#
# Plain shell assignments only. The launcher reads these values and forwards
# them to training_code.py (mostly as --flags; a few are exported to the
# Python child because they have no CLI flag).
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=Qwen/Qwen2.5-7B-Instruct
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=sft_7b_exper1

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=256
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=8192
MAX_PROMPT_LENGTH=2048

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- LoRA / MoE (exported to the Python child; no CLI flag for the MoE knobs) ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases (optional; empty -> Python default "<method>-training") ---
WANDB_PROJECT=

# --- Run mode (True = print commands, do not launch vLLM/training) ---
DRY_RUN=False
