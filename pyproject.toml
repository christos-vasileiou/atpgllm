[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atpgllm"
version = "0.7.15"
description = "LLM model that can run Automated Test Pattern Generation (ATPG) and Design Verification (DV) algorithm on synthesized verilog-based netlists."
readme = "README.md"
authors = [
    { name = "christos-vasileiou", email = "chrivasileiou2@gmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "License :: Free For Educational Use",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/christos-vasileiou/atpgllm"

[project.optional-dependencies]
graph-track = [
    "wandb>=0.16",
    "plotly>=5.10",
]
graph-search = [
    "optuna>=3.4",
    "ax-platform>=0.4.3",
    "wandb>=0.16",
    "plotly>=5.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atpgllm*"]

[tool.setuptools.package-data]
atpgllm = ["deepspeed_config.json"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}
