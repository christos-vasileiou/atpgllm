# BRIDGES re-test, Notion plan phase R5: ports prompt, 16 fault-seeded role queries from runs/bridges_retest/r3, answer-only target.
# Stage C v4b: Stage C v4 with the netlist's names back in the prompt and a
# graph stack that can move. Diagnosis of v4 (2026-10-21): 40% of the trained
# tokens are input/output names, which the graph cannot carry (its node
# features are gate attributes only), and at GRAPH_LR=1e-5 the encoder and
# Q-Former moved 0.06% and 0.18% in 30 steps. Changes from v4:
#   NETLIST_VIEW=ports    the prompt keeps the module's port declarations; the
#                         graph carries the cells.
#   PREFIX_AT=placeholder the 32 graph tokens go where the prompt names the
#                         netlist, not before the system prompt.
#   FREEZE_GRAPH_BN=True  the encoder's BatchNorm keeps its running statistics
#                         (micro-batches hold 1-8 graphs).
#   GRAPH_LR=1e-4, GRAPH_ENCODER_LR=5e-5, WARMUP_STEPS=10.
#   RETRY_FRACTION=0.1    retries train at ~0.001 loss in v4. The held-out
#                         set keeps v4's 0.3 (EVAL_RETRY_FRACTION), so it holds
#                         the same single-call rows as v4's.
# MAX_STEPS stays 300, so after the 10 warmup steps the learning rate matches
# v4 and the text SFT step for step (v4b reaches step 30 with slightly less
# total learning rate). The pilot is compared at step 30 and stopped there
# unless it is worth finishing.
#
#   bash scripts/train/run_graph_roadmap.sh scripts/train/configs/multimodal_sft_v4b.conf
#
# Stage C on the v4 x-fill dataset (local build, not on the Hub yet) with
# Granite 4.2 8B: graph-conditioned QLoRA SFT that trains the DAG encoder,
# Q-Former, graph-to-LLM projector and LoRA adapters together
# (GRAPH_POLICY=full) on chats with the fault-simulation tool. Tool calls carry
# explicit x for don't-care inputs; the final answer states care bits only.
# RETRY_FRACTION of the examples start with a real failed tool call (context
# only), simulated by TetraMAX like the v4 snapshots and the Stage D tool, and
# train the model to read why it failed and call the tool again.
#
#   bash scripts/train/run_graph_roadmap.sh scripts/train/configs/multimodal_sft_v4.conf
#
# Matched to the text SFT runs/sft_granite_4.2_8b_v4
# (sft_granite_4.2_8b_v4_a100.conf) so the two models are comparable: same
# base model and 4-bit NF4 quantization, LoRA r32/alpha 64 on all seven
# projections, LR 2e-4 with a cosine decay to 0 over 300 steps and no
# warmup, no weight decay, gradient clip 1.0, flash-attention 2, 4 A100s
# data-parallel, 8 x 32 x 4 = 1,024 conversations per step, conversations up
# to 14,336 tokens (longer ones dropped whole), rows drawn uniformly from the
# whole train split (no per-circuit cap, as the text SFT's stream), and
# validation on up to 8 faults of every held-out circuit every 10 steps with
# the lowest-loss checkpoint kept.
# What differs by design: the netlist reaches the model as 32 graph tokens
# instead of text, 30% of the conversations are retries, and the tool shows
# the po_fault view. The best checkpoint is chosen on the single-call
# held-out loss (the text SFT's validation has no retries).
STAGE=multimodal_sft
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
REVISION=
# Stage B, pretrained-encoder arm (v3 train circuits; v4 validation and test
# circuits are disjoint from them). Its gate vocabulary matches v4's
# sim_config, and only the netlist and the fault reach the encoder.
ALIGNMENT_CHECKPOINT=runs/bridges_retest/r3/best.pt
OUTPUT_DIR=runs/multimodal_sft_retest
RESUME=
ADAPTER=
LLM=ibm-granite/granite-4.2-8b
GRAPH_POLICY=full
# Pinned: the login shell exports a SIM_CONFIG for the text pipeline.
SIM_CONFIG=atpgllm/training/data/sim_config.json
LOAD=parquet
# 0 = every train row is eligible, drawn uniformly like the text SFT.
MAX_ROWS_PER_CIRCUIT=0
TOOL_FORMAT=True
# The tool shows the model the primary outputs and the fault site only.
# Stage D rollouts must use the same view (checked against the checkpoint).
TOOL_VIEW=po_fault
NETLIST_VIEW=ports
PREFIX_AT=placeholder
TARGET=answer
FREEZE_GRAPH_BN=True
RETRY_FRACTION=0.1
EVAL_RETRY_FRACTION=0.3
# Retries, probes and Stage D simulate with TetraMAX (3-valued, x inputs).
FAULT_SIM_BACKEND=tetramax
# Puts tmax on PATH and sets the license when the shell has not.
SYNOPSYS_PROFILE=/proj/cad/startup/profile.synopsys_2018_vcs_2021
# X and image libraries tmax64 needs that eng-tamale2 does not install.
TMAX_LIBRARY_PATH=$HOME/usr/lib64
# One rank per GPU (torchrun); each holds the whole 4-bit model.
CUDA_VISIBLE_DEVICES=0,1,2,3
NPROC_PER_NODE=4
# Per device: each step's 256 examples are sorted by length and packed into
# micro-batches of up to BATCH_SIZE examples and MICRO_BATCH_TOKENS padded
# tokens (graph prefix included), so typical conversations train 3 at a
# time and a 14k one alone. Measured 2026-10-20 under 4-rank DDP: 25.3 GiB
# peak per A100 on real and worst-case micro-batches; packing gains only ~2%
# per example (the 4-bit model already saturates the GPU at ~4k tokens), so
# a bigger token budget would buy memory risk, not speed.
BATCH_SIZE=8
GRAD_ACCUM=32
MICRO_BATCH_TOKENS=14400
MAX_STEPS=300
SAVE_EVERY=10
SAVE_TOTAL_LIMIT=5
LOG_EVERY=1
# Examples longer than this are dropped whole (truncation could cut through
# a tool turn). Measured 2026-10-20 on 4,000 uniform train rows: single-call
# conversations average 4.5k tokens (p90 6.9k) and 0.3% exceed 14,336.
MAX_SEQ_LEN=14336
export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
ATTN_IMPLEMENTATION=flash_attention_2
# LoRA and the new projector learn at LR, the Q-Former at GRAPH_LR and the
# encoder at GRAPH_ENCODER_LR; all warm up linearly, then decay with the
# cosine schedule.
LR=2e-4
GRAPH_LR=1e-4
GRAPH_ENCODER_LR=5e-5
WARMUP_STEPS=10
LR_SCHEDULE=cosine
WEIGHT_DECAY=0
LORA_R=32
LORA_ALPHA=64
EVAL_SPLIT=validation
EVAL_EVERY=10
EVAL_ROWS_PER_CIRCUIT=8
EVAL_EXAMPLES=792
# Tool-use probe on held-out circuits after training (PROBE_EVERY=0); each
# probe decodes two assistant turns.
PROBE_EXAMPLES=32
PROBE_EVERY=0
SEED=42
DRY_RUN=${DRY_RUN:-False}
