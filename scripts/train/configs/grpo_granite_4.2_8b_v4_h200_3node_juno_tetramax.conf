# Native TetraMAX: the launcher starts the service on the batch host (the
# training node), runs one preflight simulation (binary, license, ASAP7 cells,
# don't-care inputs), and stops it at exit.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
# Shared license budget, independent of the number of GPUs or trajectories.
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
# All five GDPO objectives: detection, activation, fidelity, format, uniqueness.
TMAX_REWARD_PROFILE=full
# Opt in after the small multi-rank pilot described in docs/TETRAMAX.md.
TMAX_PIPELINED_TOOLS=0

# ============================================================================
# GRPO/GDPO for ibm-granite/granite-4.2-8b on dataset v4 (x-fill), 3 juno h200
# nodes x 2 H200 NVL 141GB (Slurm, MaxTime 2 days, PreemptMode=REQUEUE).
# The juno QOS caps running jobs per user at 4, not nodes or GPUs.
#
# Stage the code, data and SFT checkpoint first (juno has its own filesystem):
#   scripts/train/stage_to_cluster.sh <user>@juno-vscode.hpcre.utdallas.edu:<root> \
#       runs/sft_granite_4.2_8b_v4/checkpoint-250
# then on juno, from <root>/libatpgllm:
#   ./scripts/train/submit_training_code.sh scripts/train/configs/grpo_granite_4.2_8b_v4_h200_3node_juno_tetramax.conf
#
# Same objective as grpo_granite_4.2_8b_v4_h100_juno_tetramax.conf (1,152
# retained sequences per step, best-of-32 -> 16, dual adapters, 32K context).
# Layout (the launcher dedicates the LAST node to vLLM):
#   nodes 1-2: DeepSpeed ZeRO-2 training, 4 ranks (node 1 also runs the
#              TetraMAX service; node 2 ranks reach it over IPv4)
#   node 3:    trl vllm-serve, TP=1 x DP=2 (two generation engines; a round of
#              2,304 candidates is throughput bound, which favours DP)
#
# One generation round per optimizer step (STEPS_PER_GENERATION equals
# GRADIENT_ACCUMULATION_STEPS): 72 prompts x 32 candidates are sampled, 16 per
# prompt are kept, and GDPO's batch normalization and the DAPO token mean both
# span all 1,152 kept trajectories of the step. Every round of a step uses the
# same weights, so this stays on-policy.
#
# Wall time: GRPO saves every step. A requeued job (preemption, node failure)
# resumes from its latest checkpoint (RESUME_ON_REQUEUE). Reaching the 2-day
# limit is not a requeue: resubmit with RESUME_FROM=latest and
# RESUME_TRAINING_STATE=True.
# ============================================================================

# --- Core ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/grpo_granite_4.2_8b_v4_h200_3node_tetramax

# --- Resume / streaming offset ---
# Start from the SFT checkpoint the staging script copies to .../best
# (checkpoint-250, lowest validation loss), adapter weights only.
RESUME_FROM=runs/sft_granite_4.2_8b_v4/best
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0
RESUME_ON_REQUEUE=True

# --- Optimization ---
# Two sequences per micro-step fit easily in 141GB (padded to the longer of the
# two). The objective does not change with it: DAPO normalizes by tokens.
PER_DEVICE_TRAIN_BATCH_SIZE=2
# 4 training ranks x 2 x 144 = 1,152 retained sequences per optimizer step:
# 72 prompt groups x 16 retained trajectories.
GRADIENT_ACCUMULATION_STEPS=144
MAX_STEPS=100
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
# Rolling buffer: 20,000 prompts at a time from the whole train split in a
# seeded order; the next chunk loads when training reaches it (~278 steps).
BUFFER_ROLLING=True
BUFFER_SIZE=20000
NUM_GENERATIONS=16
# Sample N trajectories, keep the NUM_GENERATIONS with maximal reward variance.
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=144
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (validation circuits; excluded from training) ---
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=validation
FIXED_EVAL_MANIFEST=runs/grpo_granite_4.2_8b_v4_h200_3node_tetramax/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1

# --- Parallelism / serving ---
USE_DDP=True
# Ranks wait in a broadcast while rank 0 generates the whole step's round.
DDP_TIMEOUT=10800
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- Topology (juno h200: g-07-[01-13], g-08-[01-13]) ---
PARTITION=h200
NODELIST=
NUM_NODES=3
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00
# Cross-node fabric for DDP and the vLLM weight sync.
NCCL_SOCKET_IFNAME=ib0
NCCL_IB_HCA=mlx5_0
# Granite (revision f8de16c, the one the SFT used) is cached here; run offline.
HF_HOME=/work/cxv200006/.cache/huggingface
HF_HUB_OFFLINE=1

# --- vLLM server (dedicated node: TP x DP must equal GPUS_PER_NODE) ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=2
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE (must match the SFT adapter) ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
