# Hint arm on v5 (combinational and full-scan circuits), plain hint.
# The hint arm of multimodal_sft_retest_hint.conf with three changes:
#   DATASET   v5, so the arm trains and is checked on both kinds of circuit.
#             A scan row's prompt declares the ports a test may set, lists
#             the input bits (primary inputs, then each flop's QN net) and
#             keeps the scan chain table.
#   HINTS     written by the graph model trained on both kinds
#             (runs/bridges_retest_seq/r3s, juno 508641), for every v5
#             problem. On the step 40 check of 11-12 the hint arm with the
#             v4-only model's hints detected 70.0% on the first try, level
#             with that model's own decoder (71.5%).
#   HINT_STYLE=plain   the suggested inputs and values, as before.
# Its twin multimodal_sft_hint_v5_rich.conf differs only in HINT_STYLE, so
# the pair answers whether the graph model's confidence and its expected
# observation points help Granite.
# Needs a data_preprocessing checkout with scan_view (DATA_PREPROCESSING_ROOT).
#
#   ARM=hint_plain STOP_AFTER=40 sbatch -t 16:00:00 scripts/train/juno_retest_stage_c.sbatch
source "$(dirname "${BASH_SOURCE[0]}")/multimodal_sft_retest_ports_only.conf"
DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v5
ALIGNMENT_CHECKPOINT=runs/bridges_retest_seq/r3s/best.pt
HINTS=runs/bridges_retest_seq/hints
HINT_STYLE=plain
OUTPUT_DIR=runs/multimodal_sft_hint_v5_plain
# Stated here too: the juno batch script reads it from this file.
MAX_STEPS=300
