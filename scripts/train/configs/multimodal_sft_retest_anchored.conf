# BRIDGES re-test, arm added 11-10: input-bit anchors in place of the 16
# graph queries. The run of multimodal_sft_retest.conf with one change.
#   FUSION=anchored   the graph slot holds zeros (same token layout as the
#                     ports-only control). The prompt lists every input bit
#                     after the port declarations, and each bit's graph
#                     vector (its node embedding joined with the care queries
#                     that point at it) is added to the tokens of its name,
#                     through a gate that starts at zero.
# Why: the answer is a list of input names with values. In the prefix arm a
# port node reaches Granite only through 16 unnamed query tokens, and its
# only tie to its name is the port_position feature. Here the name token
# carries its own port's vector. Logged per step as anchor_gate.
# R6 controls for this arm: no anchors (zero), and the row's own input
# vectors dealt to other inputs (shuffled).
#
#   bash scripts/train/run_graph_roadmap.sh scripts/train/configs/multimodal_sft_retest_anchored.conf
#   ARM=anchored sbatch scripts/train/juno_retest_stage_c.sbatch          # juno
source "$(dirname "${BASH_SOURCE[0]}")/multimodal_sft_retest.conf"
FUSION=anchored
# The gate's own learning rate. Granite's token embeddings and the projected
# anchor vectors both have norm about 32 (measured 11-10). At LR=2e-4 the
# gate reached 0.0003 in two steps and could pass under 3% of an embedding
# by step 300. At 1e-2 it can open fully if the gradient asks for it.
ANCHOR_GATE_LR=1e-2
OUTPUT_DIR=runs/multimodal_sft_retest_anchored
# Stated here too: the juno batch script reads it from this file.
MAX_STEPS=300
