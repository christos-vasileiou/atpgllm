# Native TetraMAX: the launcher starts the service on the batch node, runs one
# preflight simulation, and every training rank reaches it through
# TMAX_SERVER_FILE on the shared /work filesystem.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
TMAX_REWARD_PROFILE=full
TMAX_PIPELINED_TOOLS=0

# ============================================================================
# GRPO/GDPO for Qwen/Qwen3-30B-A3B-Instruct-2507 (MoE) on dataset v4, on 3 juno
# H200 nodes. The last node serves trl vllm-serve (TP=1, DP=2), and the other
# two run 4 DDP training ranks over InfiniBand.
#
# Starts from the SFT run of sft_qwen3_30b_a3b_v4_h200_2node_juno.conf, with the
# same protocol and lengths as grpo_granite_4.2_8b_v4_h100_juno_tetramax.conf.
#
# Weight sync pushes every LoRA-touched matrix to vLLM after each step. With
# experts targeted that is 48 x (4 + 3 x 128) = 18,624 matrices per sync, one
# HTTP call each. Time the first sync. If it dominates the step, retrain the
# SFT adapter with LORA_TARGET_MODULES=q_proj,k_proj,v_proj,o_proj (192
# matrices) and compare.
#
# Effective sequences per optimizer step: 4 ranks x 1 x 288 = 1,152
# (72 prompt groups x 16 retained trajectories), matching the Granite run.
# ============================================================================

# --- Core ---
METHOD=grpo
MODEL=Qwen/Qwen3-30B-A3B-Instruct-2507
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/grpo_qwen3_30b_a3b_v4_juno_tetramax

# --- Resume / streaming offset ---
RESUME_FROM=runs/sft_qwen3_30b_a3b_v4_juno/best
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0
RESUME_ON_REQUEUE=True

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=288
MAX_STEPS=100
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
BUFFER_ROLLING=True
BUFFER_SIZE=20000
NUM_GENERATIONS=16
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=64
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (validation circuits; excluded from training) ---
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=validation
FIXED_EVAL_MANIFEST=runs/grpo_qwen3_30b_a3b_v4_juno_tetramax/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1

# --- Parallelism / serving ---
# Plain DDP, not ZeRO-2: each H200 holds a bf16 replica, and DDP is the path
# where --moe enables find_unused_parameters for idle experts.
USE_DDP=True
DDP_TIMEOUT=3600
DEEPSPEED_CONFIG=
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- Topology (juno h200) ---
PARTITION=h200
NODELIST=
NUM_NODES=3
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
NCCL_SOCKET_IFNAME=ib0
NCCL_IB_HCA=mlx5_0

# --- vLLM server (whole last node) ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=2
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
MOE=True
BASE_PRECISION=bf16
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
