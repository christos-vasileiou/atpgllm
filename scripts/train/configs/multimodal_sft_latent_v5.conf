# Latent arm on v5 (11-14): the graph reaches Granite through the graph slot
# and the input-bit anchors, and no hint text. The graph side starts from the
# alignment test (scripts/train/latent_alignment.py, both channels, graph
# stack trained against a frozen Granite), so Granite can read it at step 0.
source "$(dirname "${BASH_SOURCE[0]}")/multimodal_sft_retest.conf"
DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v5
ALIGNMENT_CHECKPOINT=runs/bridges_retest_seq/r3s/best.pt
FUSION=both
ANCHOR_GATE_LR=1e-2
GRAPH_SIDE=runs/latent_alignment/both_graph/graph_side.pt
OUTPUT_DIR=runs/multimodal_sft_latent_v5
MAX_STEPS=300
