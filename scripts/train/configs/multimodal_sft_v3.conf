# Stage C on asap7-language-of-test-v3: graph-conditioned QLoRA SFT that
# trains the DAG encoder, Q-Former, graph-to-LLM projector and LoRA adapters
# together (GRAPH_POLICY=full) on chats with the fault-simulation tool.
# RETRY_FRACTION of the examples start with a real failed tool call (context
# only) and train the model to read why it failed and call the tool again.
STAGE=multimodal_sft
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=chrivasileiou/asap7-language-of-test-v3
REVISION=907bcb146d9bab51efc1b3b996be9e4c5f962396
# Stage B, pretrained-encoder arm (within-circuit R@1 0.31 at step 4000).
ALIGNMENT_CHECKPOINT=runs/graph_alignment_v3_pretrained_seed42/stage1_best.pt
OUTPUT_DIR=runs/multimodal_sft_v3
RESUME=
ADAPTER=
LLM=Qwen/Qwen2.5-7B-Instruct
GRAPH_POLICY=full
LOAD=parquet
MAX_ROWS_PER_CIRCUIT=2000
TOOL_FORMAT=True
RETRY_FRACTION=0.3
BATCH_SIZE=1
# One example per micro-step; 8 per optimizer step (~32 s on A100s).
GRAD_ACCUM=8
# 1500 steps = 12,000 examples (~14 per train circuit), about 13-14 hours.
MAX_STEPS=1500
SAVE_EVERY=500
# Run on two GPUs (CUDA_VISIBLE_DEVICES=0,1): the model is split across them
# (peaks 16 and 22 GB at 8192 tokens; one 40 GB A100 peaks at 38.6 GB).
# Examples longer than this are dropped whole (truncation could cut through
# a tool turn). Measured on v3 train: 72% of single-call and 57% of retry
# examples fit in 8192 tokens (42% / 25% in 4096).
MAX_SEQ_LEN=8192
# LoRA and the new projector learn at LR; the pretrained encoder and
# Q-Former at GRAPH_LR.
LR=2e-4
GRAPH_LR=1e-5
LORA_R=16
LORA_ALPHA=32
EVAL_SPLIT=validation
EVAL_EVERY=100
EVAL_EXAMPLES=64
# Tool-use probe on held-out circuits after training (PROBE_EVERY=0); each
# probe decodes two assistant turns.
PROBE_EXAMPLES=32
PROBE_EVERY=0
SEED=42
DRY_RUN=${DRY_RUN:-False}
