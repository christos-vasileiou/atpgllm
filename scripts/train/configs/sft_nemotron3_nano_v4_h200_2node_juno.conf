# ============================================================================
# SFT for nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16 on dataset v4, on 2 juno
# H200 nodes. NOT RUNNABLE YET. Blocked on the items below (docs/MOE_MULTINODE.md).
#
# Model: hybrid of 23 Mamba-2, 23 MoE and 6 attention layers, 128 routed experts
# plus 1 shared expert, top-6 routing, about 3.5B of 30B parameters active,
# reasoning on by default, qwen3_coder XML tool calls.
#
# Blockers:
#   1. Needs transformers >= 5.3 (native NemotronH) and vLLM >= 0.12, plus the
#      mamba-ssm and causal-conv1d kernels. The shared env has transformers
#      4.57.3 and vLLM 0.11.2, so this config points PYTHON_VENV at a separate
#      env (requirements and checks in docs/MOE_MULTINODE.md, section 4).
#   2. Under transformers v5, check whether experts load as nn.Linear or as fused
#      parameters (the --moe startup line warns about fused experts). Fused
#      experts need PEFT target_parameters, which training_code.py does not use.
#   3. The assistant mask patch does not know this template yet, and the
#      reasoning block must be decided (enable_thinking off, or SFT targets with
#      reasoning).
#   4. The router is a custom top-k module, not nn.Linear, so expert-load logging
#      switches itself off.
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/sft_nemotron3_nano_v4_juno
PYTHON_VENV=/work/cxv200006/myenv-moe

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0
RESUME_ON_REQUEUE=True

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=256
MAX_STEPS=2
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_PROMPT_LENGTH=8192
MAX_MODEL_LEN=14336

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True
SFT_CIRCUIT_VALIDATION=True
SFT_EVAL_STEPS=10
SFT_EVAL_PER_CIRCUIT=8
SAVE_TOTAL_LIMIT=5

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
DDP_TIMEOUT=3600
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- Topology (juno h200) ---
PARTITION=h200
NODELIST=
NUM_NODES=2
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
NCCL_SOCKET_IFNAME=ib0
NCCL_IB_HCA=mlx5_0
# Fill this cache on the login node first (hf download <model>), then run offline.
HF_HOME=/work/cxv200006/hf_cache
HF_HUB_OFFLINE=1

# --- LoRA / MoE ---
# Resolved targets include the Mamba in_proj / out_proj (NVIDIA's LoRA default).
MOE=True
BASE_PRECISION=bf16
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
