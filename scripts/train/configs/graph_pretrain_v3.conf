# Stage A on asap7-language-of-test-v3: clean snapshots, circuit- and
# structure-disjoint train/validation/test splits, difficulty labels.
# Validation uses the dataset's own 'validation' split (no split manifest);
# the 'test' split is never read here.
STAGE=graph_pretrain
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=chrivasileiou/asap7-language-of-test-v3
# Revision published 2026-10-01 (train 867 circuits / 2.39M rows,
# validation 96 circuits / 174k rows).
REVISION=907bcb146d9bab51efc1b3b996be9e4c5f962396
EVAL_SPLIT=validation
OUTPUT_DIR=runs/graph_pretrain_v3
RESUME=
BATCH_SIZE=16
GRAD_ACCUM=1
# The v2 run plateaued by step 6000 of 20000.
MAX_STEPS=10000
SAVE_EVERY=1000
EVAL_EVERY=500
# v3 stores rows grouped by circuit and one circuit is 33.5% of train: sample
# rows from the parquet files and shuffle globally, at most 2000 random rows
# per circuit (largest circuit then 0.28% of the pool).
LOAD=parquet
MAX_ROWS_PER_CIRCUIT=2000
# Validation: 78 circuits <=50 gates, 18 with 51-200, none larger. 20 random
# rows per circuit, up to 8 faults per circuit in the validation set.
EVAL_ROWS_PER_CIRCUIT=20
EVAL_FAULTS_PER_DESIGN=8
DRY_RUN=${DRY_RUN:-False}
