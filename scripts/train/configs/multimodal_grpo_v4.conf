# Stage D on the v4 x-fill dataset with Granite 4.2 8B: graph-conditioned GRPO
# with a multi-turn TetraMAX fault-simulation tool loop, from the Stage C v4
# checkpoint. Each rollout may call the tool up to MAX_TOOL_CALLS times; tool
# answers are context, only the model's own tokens train. GDPO objectives:
# detection, activation, fidelity (care bits), format, uniqueness.
STAGE=multimodal_grpo
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
REVISION=
ALIGNMENT_CHECKPOINT=runs/graph_alignment_v3_pretrained_seed42/stage1_best.pt
SFT_CHECKPOINT=runs/multimodal_sft_v4/multimodal_sft_final.pt
OUTPUT_DIR=runs/multimodal_grpo_v4
RESUME=
ADAPTER=
LLM=ibm-granite/granite-4.2-8b
GRAPH_POLICY=full
# Pinned: the login shell exports a SIM_CONFIG for the text pipeline.
SIM_CONFIG=atpgllm/training/data/sim_config.json
LOAD=parquet
MAX_ROWS_PER_CIRCUIT=2000
# Must match the SFT model's view and simulator (checked against its checkpoint).
TOOL_VIEW=po_fault
FAULT_SIM_BACKEND=tetramax
SYNOPSYS_PROFILE=/proj/cad/startup/profile.synopsys_2018_vcs_2021
# X and image libraries tmax64 needs that eng-tamale2 does not install.
TMAX_LIBRARY_PATH=$HOME/usr/lib64
CUDA_VISIBLE_DEVICES=0,1
MAX_TOOL_CALLS=3
ADVANTAGE=gdpo
NUM_GENERATIONS=8
TEMPERATURE=1.0
GRPO_BETA=0.03
BATCH_SIZE=1
GRAD_ACCUM=4
# Rollouts use HF generate (no vLLM); start short and read the probe.
MAX_STEPS=100
SAVE_EVERY=25
MAX_SEQ_LEN=8192
MAX_PROMPT_LENGTH=2048
MAX_COMPLETION_LENGTH=6144
LR=1e-5
GRAPH_LR=1e-6
LORA_R=16
LORA_ALPHA=32
EVAL_SPLIT=validation
PROBE_EXAMPLES=32
PROBE_EVERY=25
SEED=42
DRY_RUN=${DRY_RUN:-False}
