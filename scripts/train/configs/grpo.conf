# ============================================================================
# GRPO run configuration for scripts/train/run_training_code.sh
#
# This file is SOURCED by scripts/train/run_training_code.sh, which is given the config path
# as its first positional argument. Do NOT `export` anything here and do NOT
# pass these variables in the submit-time environment:
#
#   ./scripts/train/submit_training_code.sh configs/grpo.conf   # SLURM: freeze config at submit time
#   ./scripts/train/run_training_code.sh      configs/grpo.conf   # direct / interactive
#
# Plain shell assignments only. The launcher reads these values and forwards
# them to training_code.py (mostly as --flags; a few are exported to the
# Python child because they have no CLI flag).
# ============================================================================

# --- Core (MODEL may be empty for GRPO when resuming from a checkpoint) ---
METHOD=grpo
MODEL=Qwen/Qwen2.5-7B-Instruct
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=runs/grpo_7b_exper3

# --- Resume / streaming offset ---
RESUME_FROM=tests/sft_7b_exper1/checkpoint-200
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=2304
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=16384
MAX_PROMPT_LENGTH=4096
MAX_COMPLETION_LENGTH=12288

# --- GRPO-specific ---
BUFFER_SIZE=30000
NUM_GENERATIONS=16
STEPS_PER_GENERATION=16
USE_DUAL_ADAPTER=True
# Buffer ordering that controls netlist diversity per effective batch:  even_spacing (recommended) | round_robin | random
# 'even_spacing' spreads each netlist's faults uniformly across the epoch so
# every effective batch sees as many distinct netlists as possible (requires the trainer's shuffle_dataset=False, already set in training_code.py).
NETLIST_DIVERSITY_STRATEGY=even_spacing

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology (read by submit_training_code.sh -> sbatch) ---
# These drive `sbatch --partition/--nodes/--gres/--cpus-per-task/--mem/--time` so the
# SAME launcher covers single-node and multi-node without editing #SBATCH lines.
#
#   SINGLE-NODE (this file): the last GPU serves vLLM, the rest do DDP training
#     on the same node (e.g. 4xH100 -> 3 train + 1 vLLM). Keep NUM_NODES=1.
#   MULTI-NODE  (see configs/grpo_h200_2node.conf, grpo_h200_3node.conf):
#     one WHOLE node is dedicated to vLLM, the remaining nodes do homogeneous
#     DDP training. Requires NUM_NODES>=2 and GPUS_PER_NODE set to the node size.
PARTITION=h200
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=7-00:00:00

# --- vLLM server (only used when USE_VLLM=True and VLLM_MODE=server) ---
# Multi-node: the launcher forces TENSOR_PARALLEL_SIZE*DATA_PARALLEL_SIZE to
# equal GPUS_PER_NODE so the dedicated vLLM node uses all its GPUs (default
# TP=1 => DP=GPUS_PER_NODE, i.e. that many data-parallel generation engines).
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE (exported to the Python child; no CLI flag for the MoE knobs) ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases (optional; empty -> Python default "<method>-training") ---
WANDB_PROJECT=

# --- Run mode (True = print commands, do not launch vLLM/training) ---
DRY_RUN=False
