# ============================================================================
# Warm-up SFT for ibm-granite/granite-4.2-8b on dataset v5 (v4 combinational +
# full-scan sequential), first step of the v5 schedule
# (scripts/rft/run_schedule.py, schedule_v5_juno_h100.json):
#   SFT warm-up -> RFT -> GDPO -> RFT -> GDPO
# on the juno h100 node (4x H100 80GB), inside the schedule's allocation.
# The schedule sets OUTPUT_DIR and MAX_STEPS, and RESUME_FROM=latest with
# RESUME_TRAINING_STATE=True when it continues an interrupted warm-up.
#
# Prompt window 14,336 tokens: v5 sequential prompts carry the scan netlist and
# the chain table (median 5,740 tokens, 27.2% over 8,192). 6.8% of sequential
# and 2.9% of combinational problems still exceed 14,336 and are skipped;
# training_code.py prints this at start. Rows are dropped, never truncated.
#
# Kinds in every step: SFT_CIRCUIT_VALIDATION=True streams the train split
# through ShardPermutation, which spaces the two circuit kinds evenly in its
# seeded order (atpgllm/training/kinds.py). One step = 4 GPUs x 1 x 256 =
# 1,024 conversations, about 400 combinational and 620 sequential.
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v5
# Not overridable from the login shell: juno exports OUTPUT_DIR=sft_finetuned_model.
OUTPUT_DIR=${OUTPUT_DIR:?set OUTPUT_DIR (the schedule does)}

# --- Resume / streaming offset ---
# Fresh from the base weights; the schedule resumes an interrupted warm-up.
RESUME_FROM=${RESUME_FROM:-}
RESUME_TRAINING_STATE=${RESUME_TRAINING_STATE:-False}
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=256
MAX_STEPS=${MAX_STEPS:?set MAX_STEPS (the schedule does)}
REPORT_TO=wandb

# --- Sequence lengths ---
# 24,576 leaves about 10k tokens after the longest prompt for the tool call,
# the TetraMAX snapshot and the answer. The v4 A100 run peaked at 40.5 GB with
# 16k-token conversations, so 24k fits in 80 GB.
MAX_PROMPT_LENGTH=14336
MAX_MODEL_LEN=24576

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True
SFT_CIRCUIT_VALIDATION=True
SFT_EVAL_STEPS=10
SFT_EVAL_PER_CIRCUIT=8
SAVE_TOTAL_LIMIT=5
# Ordinary rows only; never inherit RFT examples from the environment.
SFT_EXTRA_MESSAGES=

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- Topology (inside the schedule's h100 allocation, launched directly) ---
PARTITION=
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
PYTHON_VENV=/work/cxv200006/myenv
HF_HOME=/work/cxv200006/.cache/huggingface

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=sft-training
export WANDB_RUN_GROUP="${WANDB_RUN_GROUP:-v5_schedule}"
export WANDB_NAME="${WANDB_NAME:-v5_schedule/warmup_sft}"

# --- Run mode ---
DRY_RUN=False

# Ranks skip into the stream independently before the first collective.
export DDP_TIMEOUT=7200
