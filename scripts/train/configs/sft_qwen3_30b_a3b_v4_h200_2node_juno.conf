# ============================================================================
# SFT for Qwen/Qwen3-30B-A3B-Instruct-2507 (MoE) on dataset v4, on 2 juno H200
# nodes (2x H200 NVL 141GB each, 4 DDP ranks over InfiniBand).
#
# Model: 48 layers, 128 experts, top-8 routing, about 3.3B of 30.5B parameters
# active per token, 262k context, Hermes JSON tool calls (the same format the
# Qwen2.5 runs used, so parsers and the assistant mask patch apply).
#
# Memory: the bf16 base (~61GB) is replicated on every GPU and LoRA trains on
# attention and every expert MLP. No NF4 and no ZeRO-3 or expert parallelism.
#
# Same data protocol and lengths as sft_granite_4.2_8b_v4_a100.conf, so the
# two runs are comparable. One step = 4 ranks x 1 x 256 = 1,024 conversations.
# Throughput is unmeasured: run MAX_STEPS=2 first and read throughput/* in W&B
# before setting the real budget. Juno caps jobs at 2 days. A preempted job is
# requeued and resumes from its latest checkpoint (RESUME_ON_REQUEUE). For
# longer runs, resubmit with RESUME_FROM=latest and RESUME_TRAINING_STATE=True.
#
# Stage first (juno has its own filesystem), then on juno-vscode:
#   scripts/train/stage_to_cluster.sh <user>@juno-vscode.hpcre.utdallas.edu:<root>
#   ./scripts/train/submit_training_code.sh scripts/train/configs/sft_qwen3_30b_a3b_v4_h200_2node_juno.conf
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=Qwen/Qwen3-30B-A3B-Instruct-2507
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/sft_qwen3_30b_a3b_v4_juno

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0
RESUME_ON_REQUEUE=True

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=256
MAX_STEPS=2
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_PROMPT_LENGTH=8192
MAX_MODEL_LEN=14336

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True
SFT_CIRCUIT_VALIDATION=True
SFT_EVAL_STEPS=10
SFT_EVAL_PER_CIRCUIT=8
SAVE_TOTAL_LIMIT=5

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
DDP_TIMEOUT=3600
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- Topology (juno h200) ---
PARTITION=h200
NODELIST=
NUM_NODES=2
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
NCCL_SOCKET_IFNAME=ib0
NCCL_IB_HCA=mlx5_0

# --- LoRA / MoE ---
MOE=True
BASE_PRECISION=bf16
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
