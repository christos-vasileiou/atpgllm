# Native TetraMAX: the launcher starts the service, runs one preflight
# simulation (binary, license, ASAP7 cells, don't-care inputs), and stops it.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
# TetraMAX must be on PATH on the compute node, or loaded through a module.
# TetraMAX availability on juno is unverified; the preflight fails fast if absent.
# TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
# Shared license budget, independent of the number of GPUs or trajectories.
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
# All five GDPO objectives: detection, activation, fidelity, format, uniqueness.
TMAX_REWARD_PROFILE=full
# Opt in after the small multi-rank pilot described in docs/TETRAMAX.md.
TMAX_PIPELINED_TOOLS=0

# ============================================================================
# GRPO/GDPO for ibm-granite/granite-4.2-8b on dataset v4 (x-fill), 4x H100 80GB
# on juno-vscode.hpcre.utdallas.edu (Slurm).
#
# Stage the code, data and SFT checkpoint first (juno has its own filesystem):
#   scripts/train/stage_to_cluster.sh <user>@juno-vscode.hpcre.utdallas.edu:<root> \
#       runs/sft_granite_4.2_8b_v4/checkpoint-<best>
# then on juno, from <root>/libatpgllm:
#   ./scripts/train/submit_training_code.sh scripts/train/configs/grpo_granite_4.2_8b_v4_h100_juno_tetramax.conf
#
# Protocol: the model calls the TetraMAX fault simulator with full vectors that
# may hold don't-cares (x), reads the 3-valued result, retries with a new
# vector after a miss, and answers with care bits only. Context: 8,192 prompt
# + 24,576 completion = 32,768 tokens, enough for three tool calls on ~99% of
# v4 rows.
#   GPU 0-2: DeepSpeed ZeRO-2 training     GPU 3: trl vllm-serve TP=1, DP=1
# ============================================================================

# --- Core ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/grpo_granite_4.2_8b_v4_h100_tetramax

# --- Resume / streaming offset ---
# Start from the SFT checkpoint the staging script copies to .../best.
# To continue this GRPO run after an interruption: RESUME_FROM=latest,
# RESUME_TRAINING_STATE=True. The rolling buffer resumes its chunk from the
# ledger in the checkpoint; SKIP_BUFFER_SIZE is not used.
RESUME_FROM=runs/sft_granite_4.2_8b_v4/best
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
# 3 training ranks x 1 x 384 = 1,152 retained sequences per optimizer step:
# 72 prompt groups x 16 retained trajectories.
GRADIENT_ACCUMULATION_STEPS=384
MAX_STEPS=100
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
# Rolling buffer: 20,000 prompts at a time from the whole train split in a
# seeded order; the next chunk loads when training reaches it (~278 steps).
BUFFER_ROLLING=True
BUFFER_SIZE=20000
NUM_GENERATIONS=16
# Sample N trajectories, keep the NUM_GENERATIONS with maximal reward variance.
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=64
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (validation circuits; excluded from training) ---
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=validation
FIXED_EVAL_MANIFEST=runs/grpo_granite_4.2_8b_v4_h100_tetramax/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1

# --- Parallelism / serving ---
USE_DDP=True
DDP_TIMEOUT=3600
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- Topology (single H100 host via Slurm on juno) ---
PARTITION=h100
# Pin four full 80GB GPUs; confirm the node name on juno (`sinfo -p h100 -N -o "%N %G"`).
NODELIST=g-04-02
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
