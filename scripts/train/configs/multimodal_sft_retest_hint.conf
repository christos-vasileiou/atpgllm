# BRIDGES re-test, arm added 11-10: the text hint control. The run of
# multimodal_sft_retest_ports_only.conf (no graph, zero slot) with one change.
#   HINTS   the graph model's decoded care inputs and values, written into
#           the prompt after the port declarations as
#           "// suggested inputs: a[3]=1 sel=1". Built for train and
#           validation by atpgllm.graph.scripts.retest_hints from the same R3
#           checkpoint the graph arms start from.
# Why: if Granite with this line does as well as Granite with graph tokens,
# a latent channel is not paying for itself and the graph model is better
# used as a proposer the LLM reads. The R4 decoder row of R6 is this hint
# copied without a language model, so the arm also shows what Granite adds.
# Caution: the graph model was fit on the train split, so its train hints
# agree with the answers more often than its validation hints do. Compare
# runs/bridges_retest/hints/summary_train_*.json with summary_validation_*.
#
#   bash scripts/train/run_graph_roadmap.sh scripts/train/configs/multimodal_sft_retest_hint.conf
#   ARM=hint sbatch scripts/train/juno_retest_stage_c.sbatch              # juno
source "$(dirname "${BASH_SOURCE[0]}")/multimodal_sft_retest_ports_only.conf"
HINTS=runs/bridges_retest/hints
OUTPUT_DIR=runs/multimodal_sft_retest_hint
# Stated here too: the juno batch script reads it from this file.
MAX_STEPS=300
