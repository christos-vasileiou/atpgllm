# Native TetraMAX variant. The launcher starts, checks, and stops the service.
# Native run; never resume fast-simulator GRPO optimizer state.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
# uncomment to load a Synopsys environment. module load tetramax/vO-2018.06-SP1
# TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
# Use an already loaded Synopsys environment, or set TMAX_SERVICE_MODULE.
# Set False above to use a separately managed shared service instead.
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
TMAX_REWARD_PROFILE=po
# Opt in after the small multi-rank pilot described in docs/TETRAMAX.md.
TMAX_PIPELINED_TOOLS=0

# ============================================================================
# GRPO/GDPO run configuration for ibm-granite/granite-4.2-8b on 4x A100 40GB
#
#   ./scripts/train/run_training_code.sh ./scripts/train/configs/grpo_granite_4.2_8b_repaired_a100_4gpu_tetramax.conf
#
# Same objective as grpo_granite_4.2_8b_repaired.conf (GDPO advantages,
# best-of-32 -> 16, dual adapters, 16K context), re-laid out for one A100 host:
#   GPU 0-1: DeepSpeed ZeRO-2 training     GPU 2-3: trl vllm-serve TP=2
# The 3 train + 1 vLLM split (TENSOR_PARALLEL_SIZE=1, GRADIENT_ACCUMULATION_STEPS=384)
# also works with equal per-prompt throughput; rollout on one GPU becomes the bottleneck.
# ============================================================================

# --- Core (MODEL may be empty for GRPO when resuming from a checkpoint) ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.stil_repaired_v1
OUTPUT_DIR=runs/grpo_granite_4.2_8b_repaired_a100_tetramax_bon32

# --- Resume / streaming offset ---
# Continue the latest completed save: policy/reference, optimizer, scheduler,
# RNG and data position. The launcher skips incomplete checkpoint directories.
RESUME_FROM=latest
RESUME_TRAINING_STATE=True
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0
# Reviewed escaped-name/STIL repair. Permit only this exact implementation
# transition; reward contract, profile, tool version and schema must still match.
# The transition is recorded separately; checkpoint 3 is never rewritten.
TMAX_RESUME_FINGERPRINT_TRANSITION=56c61eb34ba0f4520636a8965437bf1cc1fbfefac1f2e3ea341298aefad761e8:fe2e5fc321ef6557f21ee317211b6744684437173e653b25c55ef50e5608d562

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
# 2 train GPUs x 576 = 1152 sequences = 72 prompts x 16 per step, as in the
# repaired 3-GPU config (3 x 384). Measured ~350 s per 2-prompt rollout round,
# so one optimizer step takes ~3.5 h.
GRADIENT_ACCUMULATION_STEPS=576
MAX_STEPS=100
# Total schedule across all allocations; full-state resumes preserve its progress.
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
BUFFER_SIZE=60000
NUM_GENERATIONS=16
# Sample N complete trajectories, retain the best NUM_GENERATIONS by simulator reward.
# 0 restores ordinary i.i.d. GRPO groups; N must be a multiple of NUM_GENERATIONS.
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=64
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (same manifest throughout all allocations) ---
# The repaired dataset has train/validation only; validation holds the circuit
# groups reserved before SFT (159 unique faults on 9 netlists).
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=validation
# The simulator backend is frozen in the manifest; keep this separate from fast runs.
FIXED_EVAL_MANIFEST=runs/grpo_granite_4.2_8b_repaired_a100_tetramax_bon32/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1

# --- Parallelism / serving ---
USE_DDP=True
# Rank 0 can spend over 10 minutes generating a best-of-32 batch while other
# ranks wait in a broadcast. Set this before the first NCCL group is created.
DDP_TIMEOUT=3600
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- Topology (single A100 host, launched directly; no Slurm) ---
PARTITION=
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=2
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
