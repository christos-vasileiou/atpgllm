# Stage B A/B test, random-init arm (control): does Stage-A pretraining help the graph
# encoder align with text? Pair with graph_alignment_v3_pretrained.conf; the two
# differ only in GRAPH_INIT and OUTPUT_DIR (same data order, same Q-Former
# initialization, same held-out pairs).
STAGE=graph_text_alignment
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=chrivasileiou/asap7-language-of-test-v3
REVISION=907bcb146d9bab51efc1b3b996be9e4c5f962396
# Clean Stage-A run (929862f); also gives the random arm its architecture.
GRAPH_CHECKPOINT=runs/graph_pretrain_v3_clean/graph_pretrain_best.pt
GRAPH_INIT=random
OUTPUT_DIR=runs/graph_alignment_v3_random_seed${SEED:-42}
RESUME=
# Both encoders frozen: the test is what the graph features already carry.
# Q-Former, projections and the GTM/GTG heads train.
GRAPH_POLICY=frozen
FREEZE_TEXT=True
LOAD=parquet
MAX_ROWS_PER_CIRCUIT=2000
BATCH_SIZE=16
GRAD_ACCUM=1
# The 400-step pilot (2026-10-05) was still improving; ~3 steps/s on an A100.
MAX_STEPS=5000
# Only best and final checkpoints (the frozen text encoder is not saved).
SAVE_EVERY=5000
# Captions: median 864 tokens; the module name and fault come first.
MAX_TEXT_LEN=1024
MAX_ANSWER_LEN=512
NUM_WORKERS=4
# A second seed (SEED=43 ...) writes to its own directory.
SEED=${SEED:-42}
# Held-out: v3 validation circuits, one pair per (circuit, fault), up to 6
# faults per circuit (563 pairs, 96 circuits). Deciding metric:
# within_circuit_r1 (chance ~0.17); circuit_r1 and mean_r1 are reported too.
EVAL_SPLIT=validation
EVAL_EVERY=500
EVAL_ROWS_PER_CIRCUIT=20
EVAL_FAULTS_PER_CIRCUIT=6
EVAL_PAIRS=1024
SELECT_METRIC=within_circuit_r1
DRY_RUN=${DRY_RUN:-False}
