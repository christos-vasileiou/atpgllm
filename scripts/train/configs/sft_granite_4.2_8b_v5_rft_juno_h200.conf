# ============================================================================
# One SFT round of rejection sampling fine tuning on dataset v5
# (scripts/rft/run_rft.py, inside the v5 schedule on the juno h200 node):
# the round's verified trajectories (build_sft.py sft.jsonl) mixed into unseen
# rows of the ordinary v5 SFT stream, both circuit kinds evenly spaced
# (SFT_CIRCUIT_VALIDATION=True streams through ShardPermutation). The driver
# sets OUTPUT_DIR, RESUME_FROM, RESUME_TRAINING_STATE, MAX_STEPS,
# SFT_EXTRA_MESSAGES, SFT_EXTRA_FRACTION and SFT_LEARNING_RATE.
# Same as sft_granite_4.2_8b_v4_rft.conf except the dataset, the v5 prompt
# window (14,336) and the context (24,576, which build_sft.py also uses).
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v5
OUTPUT_DIR=${OUTPUT_DIR:?set OUTPUT_DIR to the round directory}

# Start from base weights: earlier SFT adapters saw other datasets.
# --- Resume / streaming offset ---
# Crash recovery: RESUME_FROM=runs/sft_granite_4.2_8b_v4/checkpoint-<N>,
# RESUME_TRAINING_STATE=True (AUTO_SKIP_FROM_RESUME then resumes the stream).
RESUME_FROM=${RESUME_FROM:?set RESUME_FROM to the starting checkpoint}
RESUME_TRAINING_STATE=${RESUME_TRAINING_STATE:-False}
AUTO_SKIP_FROM_RESUME=True
# The schedule sets it once: the first round of a later phase continues the earlier
# phase's stream (its start, a GDPO policy, has no stream offset).
SKIP_BUFFER_SIZE=${SKIP_BUFFER_SIZE:-0}

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=${GRADIENT_ACCUMULATION_STEPS:-512}
MAX_STEPS=${MAX_STEPS:?set MAX_STEPS}
REPORT_TO=wandb

# --- Sequence lengths ---
# v4 A100 memory (measured 2026-10-12, 4-bit base + LoRA r32, flash-attention 2,
# expandable segments): 16 conversations of 15.6K-16.3K tokens peaked at 40.5 of
# 40.96 GB per A100. 14,336 tokens leaves headroom for a multi-day run.
# Validation at these limits: 704 examples on 88 of 99 circuits (11 skipped).
MAX_PROMPT_LENGTH=14336
MAX_MODEL_LEN=24576

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True
# Must stay True on v5: the plain streaming path reads every combinational shard first.
SFT_CIRCUIT_VALIDATION=True
SFT_EVAL_STEPS=10
SFT_EVAL_PER_CIRCUIT=8
# Keep the 5 most recent checkpoints plus the best one.
SAVE_TOTAL_LIMIT=5
# Continuing from checkpoint-250: a tenth of the from-scratch 2e-4.
SFT_LEARNING_RATE=${SFT_LEARNING_RATE:-2e-5}
SFT_EXTRA_MESSAGES=${SFT_EXTRA_MESSAGES:?set SFT_EXTRA_MESSAGES to the build_sft.py sft.jsonl}
SFT_EXTRA_FRACTION=${SFT_EXTRA_FRACTION:-0.5}
# Tool conversations read the snapshot (no fixed "I have to verify" line, a final
# turn that names the outputs that differ); sft.jsonl also holds retry examples.
export SFT_GROUNDED_TEXT=1

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- Topology (local host, launched directly) ---
PARTITION=
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
PYTHON_VENV=/work/cxv200006/myenv
HF_HOME=/work/cxv200006/.cache/huggingface

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
# Each round's SFT is one run in the RFT project, grouped by the RFT run
# (OUTPUT_DIR is <rft run>/round_<n>/sft), named <rft run>/round_<n>/sft.
WANDB_PROJECT=rft-training
_rft_round_dir="$(dirname "$OUTPUT_DIR")"
_rft_run="$(basename "$(dirname "$_rft_round_dir")")"
export WANDB_RUN_GROUP="${WANDB_RUN_GROUP:-$_rft_run}"
export WANDB_NAME="${WANDB_NAME:-$_rft_run/$(basename "$_rft_round_dir")/sft}"

# --- Run mode ---
DRY_RUN=False

# Ranks skip into the stream independently before the first collective;
# training_code.py --ddp_timeout reads DDP_TIMEOUT for SFT too.
export DDP_TIMEOUT=7200
