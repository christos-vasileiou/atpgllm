# ============================================================================
# Plumbing smoke test for MoE SFT: allenai/OLMoE-1B-7B-0125-Instruct on juno.
# 64 experts, top-8 routing, 1.3B of 7B parameters active per token.
#
# This run checks the MoE code path, not the language of test. OLMoE has a
# 4,096 token context and a chat template without tool calls, so v4 rows lose
# their fault_simulation_tool turn and most prompts (up to 8,192 tokens) are
# dropped by the length filter. Pass criteria: training loss falls, no DDP
# "unused parameter" error, moe/load_entropy_* appears in W&B and stays near
# its starting value, and a checkpoint is written and resumes.
#
#   NUM_NODES=1 checks one H200 node (2 DDP ranks).
#   NUM_NODES=2 checks the cross-node path over InfiniBand (4 DDP ranks).
#
# Submit from <root>/libatpgllm on juno-vscode:
#   ./scripts/train/submit_training_code.sh scripts/train/configs/sft_olmoe_1b_7b_h200_juno_smoke.conf
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=allenai/OLMoE-1B-7B-0125-Instruct
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/sft_olmoe_1b_7b_juno_smoke

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
# 2 ranks x 1 x 8 = 16 conversations per step.
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=8
MAX_STEPS=20
REPORT_TO=wandb

# --- Sequence lengths (OLMoE max_position_embeddings = 4096) ---
MAX_PROMPT_LENGTH=3072
MAX_MODEL_LEN=4096

# --- SFT-specific ---
# The OLMoE template has no {% generation %} markers and no assistant mask patch.
ASSISTANT_ONLY_LOSS=False
SFT_CIRCUIT_VALIDATION=False
SAVE_TOTAL_LIMIT=2

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- Topology (juno h200: 2x H200 NVL 141GB per node, MaxTime 2 days) ---
PARTITION=h200
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=0-04:00:00
NCCL_SOCKET_IFNAME=ib0
NCCL_IB_HCA=mlx5_0

# --- LoRA / MoE ---
# MOE resolves LoRA targets from the model (attention + per-expert MLP), lets
# DDP skip experts that saw no token, and logs expert load.
MOE=True
BASE_PRECISION=bf16
LORA_RANK=16
LORA_ALPHA=32
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
