# ============================================================================
# GRPO run configuration for ibm-granite/granite-4.2-8b
#
#   ./scripts/train/submit_training_code.sh configs/grpo_granite_4.2_8b.conf
#   ./scripts/train/run_training_code.sh      configs/grpo_granite_4.2_8b.conf
#
# Set RESUME_FROM to a Granite 4.2 SFT adapter (e.g. runs/sft_granite_4.2_8b/checkpoint-200)
# before launching. Chat-string revert uses the ChatML parser with XML tool calls.
# ============================================================================

# --- Core (MODEL may be empty for GRPO when resuming from a checkpoint) ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=runs/grpo_granite_4.2_8b_bon32

# --- Resume / streaming offset ---
# Start from SFT here; use the resume config after each two-day allocation.
RESUME_FROM=runs/sft_granite_4.2_8b/checkpoint-200
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=384
MAX_STEPS=200
# Total schedule across all allocations; full-state resumes preserve its progress.
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=16384
MAX_PROMPT_LENGTH=4096
MAX_COMPLETION_LENGTH=12288

# --- GRPO-specific ---
BUFFER_SIZE=60000
NUM_GENERATIONS=16
# Sample N complete trajectories, retain the best NUM_GENERATIONS by simulator reward.
# 0 restores ordinary i.i.d. GRPO groups; N must be a multiple of NUM_GENERATIONS.
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=16
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (same manifest throughout all allocations) ---
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=test
FIXED_EVAL_MANIFEST=runs/grpo_granite_4.2_8b_bon32/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology ---
PARTITION=h100
# Optional: pin the allocation to one host or a Slurm node list (for example, g-04-02).
NODELIST=g-04-02
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
