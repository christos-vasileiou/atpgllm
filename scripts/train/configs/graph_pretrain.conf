# Stage A: target-fault-conditioned DAG encoder pretraining.
STAGE=graph_pretrain
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=runs/graph_pretrain_v2
# Design-disjoint split; build with:
#   python -m atpgllm.graph.scripts.search_graph_pipeline prepare-split \
#     --config scripts/train/configs/hpo_graph_pipeline.yaml --output "$SPLIT_MANIFEST"
SPLIT_MANIFEST=runs/graph_splits/asap7-language-of-test-v2.json
RESUME=
BATCH_SIZE=16
GRAD_ACCUM=1
MAX_STEPS=20000
SAVE_EVERY=1000
DRY_RUN=False
