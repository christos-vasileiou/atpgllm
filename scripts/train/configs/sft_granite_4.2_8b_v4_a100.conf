# ============================================================================
# SFT run configuration for ibm-granite/granite-4.2-8b on dataset v4 (x-fill),
# on one local 4x A100 40GB host (no Slurm).
#
#   ./scripts/train/run_training_code.sh scripts/train/configs/sft_granite_4.2_8b_v4_a100.conf
#
# What the model learns from each v4 row:
#   think -> one fault_simulation_tool call carrying the full vectors with
#   don't-cares (x) -> TetraMAX snapshot (3-valued) -> final answer with care
#   bits only (x inputs and unknown outputs omitted; a missing input reads as x).
#
# Data: the train split is streamed in a seeded order across all 972 circuits.
# Rows are dropped, never truncated: gate-count filter 1.5%, prompt >= 8,192
# tokens 3.4%, full conversation > 14,336 tokens 14.9%; 80% (~1.97M rows) remain
# (measured 2026-10-12; 16,384 would keep 92.8%).
#
# Budget: one step = 4 GPUs x 1 x 256 = 1,024 conversations, ~8.5k tokens each
# on average. At the 5.65k tokens/s of the last SFT run that is roughly 26 min
# per step, so MAX_STEPS=300 (~307k rows, ~16% of one epoch) is about 5.4 days.
# The cosine schedule spans MAX_STEPS. One full epoch would be ~1,925 steps.
#
# Validation: up to 8 faults from each of the 99 held-out validation circuits,
# evaluated every SFT_EVAL_STEPS; the checkpoint with the lowest validation loss
# is kept and saved to OUTPUT_DIR at the end. Circuits with no example that
# fits are skipped and logged.
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/sft_granite_4.2_8b_v4

# Start from base weights: earlier SFT adapters saw other datasets.
# --- Resume / streaming offset ---
# Crash recovery: RESUME_FROM=runs/sft_granite_4.2_8b_v4/checkpoint-<N>,
# RESUME_TRAINING_STATE=True (AUTO_SKIP_FROM_RESUME then resumes the stream).
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=256
MAX_STEPS=300
REPORT_TO=wandb

# --- Sequence lengths ---
# Memory (measured 2026-10-12, 4-bit base + LoRA r32, flash-attention 2,
# expandable segments): 16 conversations of 15.6K-16.3K tokens peaked at 40.5 of
# 40.96 GB per A100. 14,336 tokens leaves headroom for a multi-day run.
# Validation at these limits: 704 examples on 88 of 99 circuits (11 skipped).
MAX_PROMPT_LENGTH=8192
MAX_MODEL_LEN=14336

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True
SFT_CIRCUIT_VALIDATION=True
SFT_EVAL_STEPS=10
SFT_EVAL_PER_CIRCUIT=8
# Keep the 5 most recent checkpoints plus the best one.
SAVE_TOTAL_LIMIT=5

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- Topology (local host, launched directly) ---
PARTITION=
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=14-00:00:00

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
