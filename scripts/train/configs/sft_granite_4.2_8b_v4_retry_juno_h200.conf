# Retry SFT on v4: teach the model to read the fault simulator's answer and
# call again until a call detects the fault.
#
# Starts from the best RFT round (round 11, checkpoint-10, the GDPO start).
# Stream: half the v4 dataset rows (one detecting call, grounded text:
# SFT_GROUNDED_TEXT=1 drops the fixed "I have to verify" line and opens the
# final turn with the outputs that differ), half runs/retry_sft_v4/data/extra.jsonl:
#   retry.jsonl          the policy's own failed calls (RFT rounds 10-14, unhinted)
#                        followed by fewest-flip repairs, each call reading the
#                        last answer; the failed call is masked from the loss
#   kept_grounded.jsonl  round 12's kept single-call successes (the round 11
#                        policy) with the same two stock lines replaced
# Built by scripts/retry/build_retry_sft.py; every tool message was simulated
# again through GDPO's tool handler (TetraMAX), byte-identical to rollouts.
#
# One juno h200 node, 2 GPUs, 1,024 conversations per step (2 x 512).
# Submit from the juno tree:
#   scripts/train/submit_training_code.sh scripts/train/configs/sft_granite_4.2_8b_v4_retry_juno_h200.conf

METHOD=sft
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
# Hard-set: the juno login shell exports OUTPUT_DIR, MODEL and others.
OUTPUT_DIR=runs/retry_sft_v4/sft
RESUME_FROM=runs/rft_v4_a100/round_11/sft/checkpoint-10
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=512
MAX_STEPS=20
REPORT_TO=wandb
MAX_PROMPT_LENGTH=8192
# Retry examples on large netlists carry several full tables: 24,576 keeps them
# (the RFT rounds used 14,336, which would drop exactly the hard cases).
MAX_MODEL_LEN=24576
ASSISTANT_ONLY_LOSS=True
SFT_CIRCUIT_VALIDATION=True
SFT_EVAL_STEPS=10
SFT_EVAL_PER_CIRCUIT=8
SAVE_TOTAL_LIMIT=5
SFT_LEARNING_RATE=2e-5
SFT_EXTRA_MESSAGES=runs/retry_sft_v4/data/extra.jsonl
SFT_EXTRA_FRACTION=0.5
export SFT_GROUNDED_TEXT=1

USE_DUAL_ADAPTER=False
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

PARTITION=h200
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
PYTHON_VENV=/work/cxv200006/myenv
HF_HOME=/work/cxv200006/.cache/huggingface
# The two H200 NVL cards of a juno node share no NVLink: P2P hangs the first all-reduce.
export NCCL_P2P_DISABLE=1

LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

WANDB_PROJECT=sft-training
export WANDB_RUN_GROUP="${WANDB_RUN_GROUP:-retry_sft_v4}"
export WANDB_NAME="${WANDB_NAME:-retry_sft_v4/sft}"
DRY_RUN=False
export DDP_TIMEOUT=7200
