# ============================================================================
# GRPO run configuration for ibm-granite/granite-4.1-8b
#
#   ./scripts/train/submit_training_code.sh configs/grpo_granite_4.1_8b.conf
#   ./scripts/train/run_training_code.sh      configs/grpo_granite_4.1_8b.conf
#
# Set RESUME_FROM to a Granite SFT adapter (e.g. runs/sft_granite_4.1_8b/checkpoint-200)
# before launching. Chat-string revert uses the Granite start_of_role parser.
# ============================================================================

# --- Core (MODEL may be empty for GRPO when resuming from a checkpoint) ---
METHOD=grpo
MODEL=ibm-granite/granite-4.1-8b
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=runs/grpo_granite_4.1_8b

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=2304
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=16384
MAX_PROMPT_LENGTH=4096
MAX_COMPLETION_LENGTH=12288

# --- GRPO-specific ---
BUFFER_SIZE=30000
NUM_GENERATIONS=16
STEPS_PER_GENERATION=16
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology ---
PARTITION=h200
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=7-00:00:00

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=256
LORA_ALPHA=512
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
