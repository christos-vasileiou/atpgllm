# Stage D on asap7-language-of-test-v3: graph-conditioned GRPO with a
# multi-turn fault-simulation tool loop. Each rollout may call the tool up to
# MAX_TOOL_CALLS times; tool answers are context, only the model's own tokens
# train. The reward simulates the final turn's vector in full (GDPO
# objectives detection / fidelity / format, or activation too with the fast
# simulator). Trains the graph encoder, Q-Former, projector and the policy
# LoRA adapter (GRAPH_POLICY=full) against a frozen reference.
STAGE=multimodal_grpo
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=chrivasileiou/asap7-language-of-test-v3
REVISION=907bcb146d9bab51efc1b3b996be9e4c5f962396
ALIGNMENT_CHECKPOINT=runs/graph_alignment_v3_pretrained_seed42/stage1_best.pt
SFT_CHECKPOINT=runs/multimodal_sft_v3/multimodal_sft_final.pt
OUTPUT_DIR=runs/multimodal_grpo_v3
RESUME=
ADAPTER=
LLM=Qwen/Qwen2.5-7B-Instruct
GRAPH_POLICY=full
LOAD=parquet
MAX_ROWS_PER_CIRCUIT=2000
# Must match the SFT model's view (checked against its checkpoint).
TOOL_VIEW=po_fault
MAX_TOOL_CALLS=3
ADVANTAGE=gdpo
NUM_GENERATIONS=8
TEMPERATURE=1.0
GRPO_BETA=0.03
BATCH_SIZE=1
# Prompts (groups of NUM_GENERATIONS rollouts) per optimizer step; groups
# whose rollouts all score alike carry no signal and are skipped.
GRAD_ACCUM=4
# Rollouts use HF generate (no vLLM): the 2026-10-06 smoke ran 60-100 s per
# group of 2 short rollouts, so expect several minutes per group of 8 and
# roughly 30-40 min per step. Start short and read the probe.
MAX_STEPS=100
SAVE_EVERY=25
MAX_SEQ_LEN=8192
MAX_PROMPT_LENGTH=2048
# Two GPUs (CUDA_VISIBLE_DEVICES=0,1), as for Stage C.
# Room for a reasoning turn, a retry and the final answer.
MAX_COMPLETION_LENGTH=6144
# RL moves the SFT adapter far more gently than SFT (2e-4).
LR=1e-5
GRAPH_LR=1e-6
LORA_R=16
LORA_ALPHA=32
# Tool-use probe on held-out circuits every PROBE_EVERY steps and at the end.
EVAL_SPLIT=validation
PROBE_EXAMPLES=32
PROBE_EVERY=25
SEED=42
DRY_RUN=${DRY_RUN:-False}
