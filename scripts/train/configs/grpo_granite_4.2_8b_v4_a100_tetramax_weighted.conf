# Native TetraMAX: the launcher starts the service, runs one preflight
# simulation (binary, license, ASAP7 cells, don't-care inputs), and stops it.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
# tmax is on PATH on eng-tamale3 (synopsys_2018/tmax_vO-2018.06-SP1).
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
# Shared license budget, independent of the number of GPUs or trajectories.
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
# All five GDPO objectives: detection, activation, fidelity, format, uniqueness.
TMAX_REWARD_PROFILE=full
# Opt in after the small multi-rank pilot described in docs/TETRAMAX.md.
TMAX_PIPELINED_TOOLS=0

# ============================================================================
# GRPO/GDPO for ibm-granite/granite-4.2-8b on dataset v4 (x-fill), one local
# 4x A100 40GB host (eng-tamale3, no Slurm), with harder faults sampled more often.
#
#   ./scripts/train/run_training_code.sh scripts/train/configs/grpo_granite_4.2_8b_v4_a100_tetramax_weighted.conf
#
# Identical to grpo_granite_4.2_8b_v4_a100_tetramax.conf except DIFFICULTY_WEIGHTS
# and OUTPUT_DIR. Each train row is kept with probability weight / 5, so the
# levels' sampling chances are 1:2:3:4:5. With the v4 train row shares
# (83.2 / 6.5 / 5.4 / 2.1 / 2.7%), the prompt mix becomes about
# easy 61.8%, medium 9.7%, hard 12.0%, very_hard 6.3%, random_never_detects 10.2%,
# and a 20,000-prompt chunk reads about 74,000 rows.
#
# Same objective as grpo_granite_4.2_8b_v4_h100_juno_tetramax.conf (1,152
# retained sequences per step, best-of-32 -> 16, dual adapters, 32K context),
# re-laid out for one A100 host:
#   GPU 0-1: DeepSpeed ZeRO-2 training     GPU 2-3: trl vllm-serve TP=2
#
# One generation round per optimizer step (STEPS_PER_GENERATION equals
# GRADIENT_ACCUMULATION_STEPS): 72 prompts x 32 candidates are sampled, 16 per
# prompt are kept, and GDPO's batch normalization and the DAPO token mean both
# span all 1,152 kept trajectories of the step. Every round of a step uses the
# same weights, so this stays on-policy.
# The repaired-v1 TetraMAX run on this layout clipped 1-2% of completions at the
# full 24,576 tokens on every step for 11 steps without running out of memory.
# It measured ~350 s per 2-prompt rollout round, ~3.5 h per optimizer step.
#
# The SFT run (W&B sft-training/c1repjqv) stopped at step 254 when the host
# rebooted; checkpoint-250 has the lowest validation loss (0.01852).
# ============================================================================

# --- Core ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
OUTPUT_DIR=runs/grpo_granite_4.2_8b_v4_a100_tetramax_weighted

# --- Resume / streaming offset ---
# Start from the best SFT checkpoint, adapter weights only.
# To continue this GRPO run after an interruption (eng-tamale3 reboots Mondays
# at 01:00), override both from the environment:
#   RESUME_FROM=latest RESUME_TRAINING_STATE=True ./scripts/train/run_training_code.sh <this config>
# The rolling buffer resumes its chunk from the ledger in the checkpoint;
# SKIP_BUFFER_SIZE is not used.
RESUME_FROM=${RESUME_FROM:-runs/sft_granite_4.2_8b_v4/checkpoint-250}
RESUME_TRAINING_STATE=${RESUME_TRAINING_STATE:-False}
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
# 2 training ranks x 1 x 576 = 1,152 retained sequences per optimizer step:
# 72 prompt groups x 16 retained trajectories.
GRADIENT_ACCUMULATION_STEPS=576
MAX_STEPS=100
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
# Rolling buffer: 20,000 prompts at a time from the whole train split in a
# seeded order; the next chunk loads when training reaches it (~278 steps).
BUFFER_ROLLING=True
# Relative sampling chance per difficulty level (easy p >= 1/4, medium >= 1/16,
# hard >= 1/256, very_hard > 0, random_never_detects: no random vector detects).
DIFFICULTY_WEIGHTS=easy=1,medium=2,hard=3,very_hard=4,random_never_detects=5
BUFFER_SIZE=20000
NUM_GENERATIONS=16
# Sample N trajectories, keep the NUM_GENERATIONS with maximal reward variance.
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=576
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (validation circuits; excluded from training) ---
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=validation
# Same seed and split as the unweighted run, so the same 72 faults (37 easy, 35 RND).
FIXED_EVAL_MANIFEST=runs/grpo_granite_4.2_8b_v4_a100_tetramax_weighted/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
# Every step, so every checkpoint has a score to rank (~26 min against a
# 6-10 h step).
FIXED_EVAL_STEPS=1
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1
# Keep the 10 best checkpoints by fixed-eval detection (answer activates the
# fault and propagates it to an output), ties broken by total reward, plus the
# latest one for resuming. Ranking in OUTPUT_DIR/best_checkpoints.json.
KEEP_BEST_CHECKPOINTS=10

# --- Parallelism / serving ---
USE_DDP=True
# Rank 0 generates the whole step's round (2,304 candidates) while the other
# rank waits in a broadcast. The v4 smoke generated 530-1,300 tokens/s, which
# puts a round at 2-6 h, so the timeout leaves room for the slow end.
DDP_TIMEOUT=43200
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002
# Weight-sync port below the ephemeral range. TRL's default 51216 collided with
# an outbound HTTPS connection's source port on 2026-10-22 (EADDRINUSE).
VLLM_GROUP_PORT=29600

# --- Topology (single A100 host, launched directly; no Slurm) ---
PARTITION=
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=14-00:00:00

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=2
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE (must match the SFT adapter) ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
