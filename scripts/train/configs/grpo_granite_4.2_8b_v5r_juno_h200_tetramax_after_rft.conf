# v5r GDPO after RFT: the v5 GDPO settings (8 call cap, 32,768 window), W&B project atpg-v5-retry.
# ============================================================================
# GDPO after RFT on dataset v5, inside the v5 schedule
# (scripts/rft/run_schedule.py -> run_rft.py) on one juno h200 node
# (2x H200 141GB): GPU 0 trains (one rank), GPU 1 runs trl vllm-serve. One rank
# takes the 1,152 completions of a step that two ranks shared on the h200 node
# (GRADIENT_ACCUMULATION_STEPS and STEPS_PER_GENERATION 1152), so a step holds
# the same 72 prompts.
# Same objective as grpo_granite_4.2_8b_v4_a100_tetramax_after_rft.conf (staged
# reward, difficulty weights, best-of-32 -> 16, dual adapters) except:
#   * TRAIN_DATASET v5; the rolling buffer spaces the two circuit kinds evenly
#     inside every chunk, so every optimizer step's prompts hold both;
#   * prompt window 14,336 (6.8% of sequential and 2.9% of combinational
#     problems are still longer and skipped), completion 18,432, so the
#     context stays 32,768 as in v4;
#   * the fixed evaluation is the v5 benchmark manifest, 50 per level split
#     evenly between kinds (build_eval_manifest.py --kind_shares), which the
#     driver copies into OUTPUT_DIR: FIXED_EVAL_SELECTION=stratified_family_kind_v1.
# The driver sets OUTPUT_DIR and RESUME_FROM (the best RFT round), and
# RESUME_FROM=latest RESUME_TRAINING_STATE=True to continue.
# ============================================================================

# Native TetraMAX: the launcher starts the service on this node, runs one
# preflight simulation, and stops it at exit.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
# Every job and host gets its own seat pool (the shared juno pools are bound to other hosts).
TMAX_LOCK_DIR="$(cd .. && pwd)/.runtime/tmax_locks/${SLURM_JOB_ID:-nojob}_$(hostname -s)"
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
TMAX_REWARD_PROFILE=staged
TMAX_PIPELINED_TOOLS=0

# --- Core ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v5
# Not overridable from the login shell: juno exports OUTPUT_DIR=sft_finetuned_model.
OUTPUT_DIR=${OUTPUT_DIR:?set OUTPUT_DIR (the driver does)}

# --- Resume / streaming offset ---
# Start from the best SFT checkpoint, adapter weights only.
# To continue this GRPO run after an interruption (eng-tamale3 reboots Mondays
# at 01:00), override both from the environment:
#   RESUME_FROM=latest RESUME_TRAINING_STATE=True ./scripts/train/run_training_code.sh <this config>
# The rolling buffer resumes its chunk from the ledger in the checkpoint;
# SKIP_BUFFER_SIZE is not used.
RESUME_FROM=${RESUME_FROM:?set RESUME_FROM to the best RFT checkpoint}
RESUME_TRAINING_STATE=${RESUME_TRAINING_STATE:-False}
# At most 8 executed tool calls per completion (user, 2026-11-23), the budget
# RFT sampling and the RFT evaluations use too. A 9th call ends the completion.
export GRPO_MAX_TOOL_CALLS=8
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
# 2 training ranks x 1 x 576 = 1,152 retained sequences per optimizer step:
# 72 prompt groups x 16 retained trajectories.
GRADIENT_ACCUMULATION_STEPS=1152
MAX_STEPS=${MAX_STEPS:-40}
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=14336
MAX_COMPLETION_LENGTH=18432

# --- GRPO-specific ---
# Rolling buffer: 20,000 prompts at a time from the whole train split in a
# seeded order; the next chunk loads when training reaches it (~278 steps).
BUFFER_ROLLING=True
# Relative sampling chance per difficulty level (easy p >= 1/4, medium >= 1/16,
# hard >= 1/256, very_hard > 0, random_never_detects: no random vector detects).
DIFFICULTY_WEIGHTS=easy=1,medium=13,hard=16,very_hard=40,random_never_detects=40
BUFFER_SIZE=20000
NUM_GENERATIONS=16
# Sample N trajectories, keep the NUM_GENERATIONS with maximal reward variance.
TRAIN_BEST_OF_N=32
STEPS_PER_GENERATION=1152
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (validation circuits; excluded from training) ---
# 250 faults, 50 per difficulty level (25 per kind), spread over generator
# families and netlists, frozen by scripts/rft/build_eval_manifest.py. The driver copies it
# here. The earlier 72 faults came from two netlists.
FIXED_EVAL_SIZE=250
FIXED_EVAL_SPLIT=validation
FIXED_EVAL_SELECTION=stratified_family_kind_v1
FIXED_EVAL_MANIFEST=${OUTPUT_DIR}/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
# Every 2 steps (~90 min against 11.6 h), when the driver also stops for the
# direct sampling benchmark. This greedy score only ranks checkpoints to keep.
FIXED_EVAL_STEPS=2
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1
# Keep the 10 best checkpoints by fixed-eval detection (answer activates the
# fault and propagates it to an output), ties broken by total reward, plus the
# latest one for resuming. Ranking in OUTPUT_DIR/best_checkpoints.json.
KEEP_BEST_CHECKPOINTS=10

# --- Parallelism / serving ---
USE_DDP=True
# Rank 0 generates the whole step's round (2,304 candidates) while the other
# rank waits in a broadcast. The v4 smoke generated 530-1,300 tokens/s, which
# puts a round at 2-6 h, so the timeout leaves room for the slow end.
DDP_TIMEOUT=43200
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002
# Weight-sync port below the ephemeral range. TRL's default 51216 collided with
# an outbound HTTPS connection's source port on 2026-10-22 (EADDRINUSE).
VLLM_GROUP_PORT=29600

# --- Topology (inside the schedule's h200 allocation, launched directly) ---
PARTITION=
NODELIST=
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=256G
TIME_LIMIT=2-00:00:00
PYTHON_VENV=/work/cxv200006/myenv
# Compute nodes have internet; HF_HUB_OFFLINE=1 breaks the hub-id tokenizer load in vLLM.
HF_HOME=/work/cxv200006/.cache/huggingface

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE (must match the SFT adapter) ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
# grpo-training, next to the earlier GDPO runs; one run, continued on resume.
WANDB_PROJECT=atpg-v5-retry
export WANDB_RUN_GROUP="${WANDB_RUN_GROUP:-v5r_schedule}"
export WANDB_NAME="${WANDB_NAME:-$(basename "$OUTPUT_DIR")}"

# --- Run mode ---
DRY_RUN=False
