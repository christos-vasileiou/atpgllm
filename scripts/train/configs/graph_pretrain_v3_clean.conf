# Stage A rerun on asap7-language-of-test-v3 with the fixes found after the
# first v3 run (runs/graph_pretrain_v3): the vector/port check now runs
# (4b72570), AP scores tied nodes as one group (0f0c127), and validation is
# stratified by fault difficulty so hard faults are measured.
STAGE=graph_pretrain
# Optional Slurm placement (for submission wrappers): one host or a Slurm node list.
NODELIST=
DATASET=chrivasileiou/asap7-language-of-test-v3
REVISION=907bcb146d9bab51efc1b3b996be9e4c5f962396
EVAL_SPLIT=validation
OUTPUT_DIR=runs/graph_pretrain_v3_clean
RESUME=
BATCH_SIZE=16
GRAD_ACCUM=1
# The first v3 run's validation score levelled off by step 5000 of 10000.
MAX_STEPS=5000
SAVE_EVERY=1000
EVAL_EVERY=500
# At most 2000 random training rows per circuit (largest circuit then 0.28%
# of the pool instead of 33.5%).
LOAD=parquet
MAX_ROWS_PER_CIRCUIT=2000
# Validation: 20 random rows per (circuit, difficulty), then up to 60 graphs
# per (size bucket, difficulty) and 8 per (circuit, difficulty). Measured
# 2026-10-05: 536 graphs, 120 hard and 120 very_hard (first v3 run: 14 and 2).
EVAL_ROWS_PER_CIRCUIT=20
EVAL_GRAPHS_PER_DIFFICULTY=60
EVAL_FAULTS_PER_DESIGN=8
DRY_RUN=${DRY_RUN:-False}
