# Hint arm on v5, rich hint: multimodal_sft_hint_v5_plain.conf with one change.
#   HINT_STYLE=rich   the hint also says how sure the graph model is and
#                     where it expects the fault to show:
#                       // suggested inputs: a[3]=1 sel=0?
#                       // possibly needed: b=1 c=0?
#                       // observe at: y n10
#                     A "?" marks a value close to a coin flip. On v5
#                     validation such values are right 57% to 74% of the
#                     time, against 85% to 98% for the others, and they are
#                     a fifth of all suggested values. A model that reads
#                     the marks knows what to change after a failed call.
#
#   ARM=hint_rich STOP_AFTER=40 sbatch -t 16:00:00 scripts/train/juno_retest_stage_c.sbatch
source "$(dirname "${BASH_SOURCE[0]}")/multimodal_sft_hint_v5_plain.conf"
HINT_STYLE=rich
OUTPUT_DIR=runs/multimodal_sft_hint_v5_rich
MAX_STEPS=300
