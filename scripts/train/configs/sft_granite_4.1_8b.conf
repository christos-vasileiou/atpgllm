# ============================================================================
# SFT run configuration for ibm-granite/granite-4.1-8b
#
#   ./scripts/train/submit_training_code.sh configs/sft_granite_4.1_8b.conf
#   ./scripts/train/run_training_code.sh      configs/sft_granite_4.1_8b.conf
#
# Same LoRA / batch recipe as configs/sft.conf. Default LoRA targets
# (q/k/v/o + gate/up/down) match GraniteForCausalLM. ASSISTANT_ONLY_LOSS
# uses the Granite {% generation %} chat-template patch.
# ============================================================================

# --- Core ---
METHOD=sft
MODEL=ibm-granite/granite-4.1-8b
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=runs/sft_granite_4.1_8b

# --- Resume / streaming offset ---
RESUME_FROM=
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=True
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=256
MAX_STEPS=200
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=8192
MAX_PROMPT_LENGTH=2048

# --- SFT-specific ---
ASSISTANT_ONLY_LOSS=True

# --- Adapters ---
USE_DUAL_ADAPTER=False

# --- Parallelism / serving ---
USE_DDP=True
USE_VLLM=False
VLLM_MODE=server
PORT=8002

# --- SLURM resources / topology ---
PARTITION=h200
NUM_NODES=1
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=7-00:00:00

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
