# Fixed-evaluation pilot: SFT baseline at step 0, then steps 5/10/15/20.
# Submit from the repository root with scripts/train/submit_training_code.sh.
# Standalone config: the submit wrapper freezes this entire file.
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=chrivasileiou/asap7-language-of-test-v2
OUTPUT_DIR=runs/grpo_granite_4.2_8b_pilot
RESUME_FROM=runs/sft_granite_4.2_8b/checkpoint-200
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

PER_DEVICE_TRAIN_BATCH_SIZE=1
GRADIENT_ACCUMULATION_STEPS=384
MAX_STEPS=20
GRPO_LEARNING_RATE=1e-6
GRPO_WARMUP_STEPS=2
REPORT_TO=wandb
MAX_MODEL_LEN=16384
MAX_PROMPT_LENGTH=4096
MAX_COMPLETION_LENGTH=12288
BUFFER_SIZE=60000
NUM_GENERATIONS=16
STEPS_PER_GENERATION=16
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# Three training ranks + one serving GPU. Global eval batch = 3, one
# complete fault group per batch. 72 faults x 3 completions per evaluation.
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=test
FIXED_EVAL_MANIFEST=runs/fixed_eval/granite_4.2_8b_pilot.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=3
FIXED_EVAL_BATCH_SIZE=1

USE_DDP=True
USE_VLLM=True
VLLM_MODE=server
PORT=8003
PARTITION=h100
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=
WANDB_PROJECT=
DRY_RUN=False
