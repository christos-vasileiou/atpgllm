# Custom fast fault simulator; no TetraMAX service or licenses required.
# Start from repaired SFT weights with fresh optimizer state.
FAULT_SIM_BACKEND=fast
TMAX_MANAGE_SERVICE=False
TMAX_SERVER_FILE=
TMAX_MAX_CONCURRENT=
TMAX_TIMEOUT_S=
TMAX_ACQUIRE_TIMEOUT_S=
TMAX_REWARD_PROFILE=
TMAX_PIPELINED_TOOLS=0

# ============================================================================
# GRPO/GDPO run configuration for ibm-granite/granite-4.2-8b on 4x H100 80GB
#
# From the atpgllm repo root:
#   ./scripts/train/submit_training_code.sh configs/grpo_granite_4.2_8b_repaired_h100_4gpu.conf
#
# Same objective as the A100 variant: GDPO, best-of-32 -> 16, dual adapters,
# and 32K total context (8K prompt + 24K completion).
#   GPU 0-2: DeepSpeed ZeRO-2 training     GPU 3: trl vllm-serve TP=1, DP=1
# Indices refer to the four GPUs made visible by Slurm.
# One serving GPU fits the model; vLLM batches trajectories within its KV cache.
# Full-length best-of-32 groups do not all fit concurrently; benchmark throughput.
# ============================================================================

# --- Core (MODEL may be empty for GRPO when resuming from a checkpoint) ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.stil_repaired_v1
OUTPUT_DIR=runs/grpo_granite_4.2_8b_repaired_h100_bon32

# --- Resume / streaming offset ---
# Start from the repaired SFT adapter. To continue this run, set RESUME_FROM=latest,
# RESUME_TRAINING_STATE=True and AUTO_SKIP_FROM_RESUME=True.
RESUME_FROM=runs/sft_granite_4.2_8b_repaired/checkpoint-90
RESUME_TRAINING_STATE=False
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0

# --- Optimization ---
PER_DEVICE_TRAIN_BATCH_SIZE=1
# 3 training ranks x batch 1 x 384 = 1152 retained sequences per optimizer step:
# 72 prompt groups x 16 retained trajectories, matching 2 x 576 on A100.
GRADIENT_ACCUMULATION_STEPS=384
MAX_STEPS=100
# Total schedule across all allocations; full-state resumes preserve its progress.
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
BUFFER_SIZE=60000
NUM_GENERATIONS=16
# Sample N complete trajectories, retain the best NUM_GENERATIONS by simulator reward.
# 0 restores ordinary i.i.d. GRPO groups; N must be a multiple of NUM_GENERATIONS.
TRAIN_BEST_OF_N=32
# 3 x 1 x 64 = 192 retained sequences (12 prompt groups) per generation batch;
# best-of-32 samples 384 candidates. Six generation batches per optimizer step.
STEPS_PER_GENERATION=64
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (same manifest throughout all allocations) ---
# The repaired dataset has train/validation only; validation holds the circuit
# groups reserved before SFT (159 unique faults on 9 netlists).
FIXED_EVAL_SIZE=72
FIXED_EVAL_SPLIT=validation
FIXED_EVAL_MANIFEST=runs/grpo_granite_4.2_8b_repaired_h100_bon32/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=5
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1

# --- Parallelism / serving ---
USE_DDP=True
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002

# --- Topology (single H100 host via Slurm) ---
PARTITION=h100
# Pin four full 80GB GPUs; other h100 nodes may expose smaller MIG devices.
NODELIST=g-04-02
NUM_NODES=1
GPUS_PER_NODE=4
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00

# --- vLLM server ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=1
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
WANDB_PROJECT=

# --- Run mode ---
DRY_RUN=False
