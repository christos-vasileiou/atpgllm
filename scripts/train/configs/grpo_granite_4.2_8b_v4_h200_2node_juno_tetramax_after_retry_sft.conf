# ============================================================================
# GDPO after retry SFT (2026-11-23), on 2 juno h200 nodes x 2 H200 NVL
# 141GB (Slurm, MaxTime 2 days, PreemptMode=REQUEUE).
#
# Same objective as grpo_granite_4.2_8b_v4_a100_tetramax_after_rft.conf (staged
# reward, difficulty weights, 250-fault stratified fixed eval every 2 steps,
# 10 best checkpoints kept, 1,152 retained sequences per step, best-of-32 -> 16,
# dual adapters, 8K+24K context), laid out like
# grpo_granite_4.2_8b_v4_h200_2node_juno_tetramax.conf:
#   node 1: DeepSpeed ZeRO-2 training on 2 GPUs + TetraMAX service
#   node 2: trl vllm-serve, TP=1 x DP=2 (two generation engines)
#
# Start point: the retry SFT checkpoint that passed the gate
# (scripts/retry/juno_gate.sbatch, runs/retry_sft_v4/gate), adapter weights only.
# Retry SFT started from RFT round 11 and taught the model to read the tool's
# answer and call again until a call detects. GRPO's tool loop has no call cap
# (only the 32K context), so retries are sampled in rollouts. The staged reward
# scores detection 1/K over the calls up to the first detection (K = 1 is 1.0).
#
# There is no RFT driver on juno, so OUTPUT_DIR/fixed_eval_manifest.json must be
# staged before the first submit. It is runs/rft_v4_a100/eval/robust_eval_manifest.json
# unchanged. GRPO loads the hub tokenizer even when resuming from an adapter
# (load_model_from_adapter), so the protocol carries the hub chat template hash
# ea31e9c1, not the round-11 one. Restamping it to b6fc5aff made juno jobs
# 506301 and 506302 fail with "protocol changed" (2026-11-10).
#
# From <root>/libatpgllm on juno:
#   ./scripts/train/submit_training_code.sh scripts/train/configs/grpo_granite_4.2_8b_v4_h200_2node_juno_tetramax_after_rft.conf
# A job that reaches the 2-day limit is not requeued. Submit the same command
# again (e.g. sbatch --dependency=afterany:<id>): once OUTPUT_DIR holds a
# checkpoint, this config resumes from the latest one with its training state.
# ============================================================================

# Native TetraMAX: the launcher starts the service on the batch host (the
# training node), runs one preflight simulation, and stops it at exit.
FAULT_SIM_BACKEND=tetramax
TMAX_MANAGE_SERVICE=True
TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
TMAX_SERVER_FILE=../.runtime/tetramax/server.json
# The default lock dir resolves through the data_preprocessing symlink to
# atpg_v4/.runtime/tetramax, whose pool.json is bound to c-01-08 and fails
# closed elsewhere. Give every job and host its own seat pool.
TMAX_LOCK_DIR="$(cd .. && pwd)/.runtime/tmax_locks/${SLURM_JOB_ID:-nojob}_$(hostname -s)"
TMAX_MAX_CONCURRENT=16
TMAX_TIMEOUT_S=120
TMAX_ACQUIRE_TIMEOUT_S=120
# The staged reward (docs/reports/REWARD_STAGED.md): propagation and controlling
# stages, answer-verified detection.
TMAX_REWARD_PROFILE=staged
TMAX_PIPELINED_TOOLS=0

# --- Core ---
METHOD=grpo
MODEL=ibm-granite/granite-4.2-8b
TRAIN_DATASET=../data/freeset/dataset.freeset.asap7sc7p5t_28.rvt.tt.v4
# Not overridable: the juno login shell exports OUTPUT_DIR=sft_finetuned_model
# (and MODEL, METHOD, ...), and sbatch passes the submit environment on.
OUTPUT_DIR=runs/grpo_granite_4.2_8b_v4_h200_tetramax_after_retry_sft

# --- Resume ---
# First job: round-11 adapter weights only. Any later job (continuation after
# the 2-day limit): latest checkpoint with its training state.
# Hard-set: the juno login shell exports RESUME_FROM. A continuation job needs a
# copy of this file with RESUME_FROM=<latest checkpoint> and RESUME_TRAINING_STATE=True
# (as for 521449); the launcher resumes OUTPUT_DIR by itself only on a requeue.
RESUME_FROM=runs/retry_sft_v4/sft/checkpoint-20
RESUME_TRAINING_STATE=False
# At most 8 executed tool calls per completion (user, 2026-11-23); the gate
# evaluated the retry SFT with the same budget. A 9th call ends the completion
# unexecuted, with no final answer.
export GRPO_MAX_TOOL_CALLS=8
AUTO_SKIP_FROM_RESUME=False
SKIP_BUFFER_SIZE=0
RESUME_ON_REQUEUE=True

# --- Optimization ---
# 2 training ranks x 2 x 288 = 1,152 retained sequences per optimizer step:
# 72 prompt groups x 16 retained trajectories. DAPO normalizes by tokens, so
# per-device batch 2 does not change the objective.
PER_DEVICE_TRAIN_BATCH_SIZE=2
GRADIENT_ACCUMULATION_STEPS=288
MAX_STEPS=100
GRPO_LEARNING_RATE=5e-6
GRPO_WARMUP_STEPS=10
REPORT_TO=wandb

# --- Sequence lengths ---
MAX_MODEL_LEN=32768
MAX_PROMPT_LENGTH=8192
MAX_COMPLETION_LENGTH=24576

# --- GRPO-specific ---
BUFFER_ROLLING=True
DIFFICULTY_WEIGHTS=easy=1,medium=13,hard=16,very_hard=40,random_never_detects=40
BUFFER_SIZE=20000
NUM_GENERATIONS=16
TRAIN_BEST_OF_N=32
# One generation round per optimizer step (equals GRADIENT_ACCUMULATION_STEPS).
STEPS_PER_GENERATION=288
USE_DUAL_ADAPTER=True
NETLIST_DIVERSITY_STRATEGY=even_spacing
DISABLE_DROPOUT=True
VLLM_IMPORTANCE_SAMPLING_MODE=token_truncate

# --- Fixed raw evaluation (validation circuits; excluded from training) ---
# 250 faults, 50 per difficulty level, frozen by scripts/rft/build_eval_manifest.py.
FIXED_EVAL_SIZE=250
FIXED_EVAL_SPLIT=validation
FIXED_EVAL_SELECTION=stratified_family_v2
FIXED_EVAL_MANIFEST=${OUTPUT_DIR}/fixed_eval_manifest.json
FIXED_EVAL_SEED=1729
FIXED_EVAL_STEPS=2
FIXED_EVAL_GENERATIONS=1
FIXED_EVAL_BATCH_SIZE=1
KEEP_BEST_CHECKPOINTS=10

# --- Parallelism / serving ---
USE_DDP=True
DDP_TIMEOUT=43200
DEEPSPEED_CONFIG=scripts/train/configs/ds_zero2.json
USE_VLLM=True
VLLM_MODE=server
PORT=8002
VLLM_GROUP_PORT=29600

# --- Topology (juno h200: g-07-[01-13], g-08-[01-13]) ---
PARTITION=h200
NODELIST=
NUM_NODES=2
GPUS_PER_NODE=2
CPUS_PER_TASK=32
MEM=128G
TIME_LIMIT=2-00:00:00
PYTHON_VENV=/work/cxv200006/myenv
# Cross-node fabric for DDP and the vLLM weight sync.
NCCL_SOCKET_IFNAME=ib0
NCCL_IB_HCA=mlx5_0
# The two H200s of a node sit on different PCIe host bridges without NVLink;
# NCCL P2P hangs there (juno job 503277, 2026-11-09). The launcher does not
# forward this variable, so export it here.
export NCCL_P2P_DISABLE=1
# Compute nodes have internet. HF_HUB_OFFLINE=1 breaks loading the Granite
# tokenizer by hub id (transformers 4.57 _patch_mistral_regex calls model_info),
# which vLLM does. The hub head a7042144 has the same weights and tokenizer
# files as f8de16c, the revision the SFT used.
HF_HOME=/work/cxv200006/.cache/huggingface

# --- vLLM server (dedicated node: TP x DP must equal GPUS_PER_NODE) ---
TENSOR_PARALLEL_SIZE=1
DATA_PARALLEL_SIZE=2
VLLM_GPU_MEM_UTIL=0.9

# --- LoRA / MoE (must match the SFT adapter) ---
LORA_RANK=32
LORA_ALPHA=64
LORA_TARGET_MODULES=
QWEN_MOE=False
TUNE_MOE_ROUTER=0
MOE_MAX_MEMORY_GIB=

# --- Weights & Biases ---
# grpo-training, next to the earlier GDPO runs; one run, continued on resume.
WANDB_PROJECT=
export WANDB_NAME="${WANDB_NAME:-$(basename "$OUTPUT_DIR")}"

# --- Run mode ---
DRY_RUN=False
