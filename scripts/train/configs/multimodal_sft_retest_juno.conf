# BRIDGES re-test R5 on juno: multimodal_sft_retest.conf (or ARM_CONF) with
# juno's GPUs, TetraMAX and paths. Started by scripts/train/juno_retest_stage_c.sbatch.
#
# Same training as on the tamale A100s except the data-parallel width: one
# h200 node has 2 GPUs, so GRAD_ACCUM doubles and every step still trains
# 8 x 64 x 2 = 1,024 conversations (4 A100s: 8 x 32 x 4).
_JUNO_GPUS="${CUDA_VISIBLE_DEVICES:-0,1}"
source "$(dirname "${BASH_SOURCE[0]}")/${ARM_CONF:-multimodal_sft_retest.conf}"
CUDA_VISIBLE_DEVICES="$_JUNO_GPUS"
NPROC_PER_NODE=$(awk -F, '{print NF}' <<<"$CUDA_VISIBLE_DEVICES")
# The base config's per-step total (BATCH_SIZE x GRAD_ACCUM x 4 ranks) kept.
GRAD_ACCUM=$(( GRAD_ACCUM * 4 / NPROC_PER_NODE ))
# TetraMAX comes from juno's module (the sbatch loads it; the preflight loads
# it again if needed), with its own license server. No tamale site profile.
SYNOPSYS_PROFILE=
TMAX_LIBRARY_PATH=
TMAX_SERVICE_MODULE=tetramax/vO-2018.06-SP1
# Failed first calls for retry examples come from up to 24 TetraMAX runs
# each. One search thread per rank left the GPUs waiting (21 minutes per
# step on 11-09). 4 per rank on 2 ranks uses the job's 8 TetraMAX seats.
EXAMPLE_WORKERS=${EXAMPLE_WORKERS:-4}
# Smoke overrides from the environment (the sbatch sets them for SMOKE=1).
MAX_STEPS=${SMOKE_MAX_STEPS:-$MAX_STEPS}
GRAD_ACCUM=${SMOKE_GRAD_ACCUM:-$GRAD_ACCUM}
EVAL_EVERY=${SMOKE_EVAL_EVERY:-$EVAL_EVERY}
SAVE_EVERY=${SMOKE_SAVE_EVERY:-$SAVE_EVERY}
EVAL_EXAMPLES=${SMOKE_EVAL_EXAMPLES:-$EVAL_EXAMPLES}
PROBE_EXAMPLES=${SMOKE_PROBE_EXAMPLES:-$PROBE_EXAMPLES}
OUTPUT_DIR=${SMOKE_OUTPUT_DIR:-$OUTPUT_DIR}
RESUME=${RESUME_FROM:-}
